{t:`Commonly Confused Words`, s:`their/there/they're, your/you're, its/it's and more`,
lesson:`
<p>These words sound alike but mean different things. Spell-check won't catch them — you have to!</p>
<div class="tablewrap"><table>
<tr><th>Word</th><th>Meaning</th><th>Example</th><th>Memory trick</th></tr>
<tr><td><b>their</b></td><td>belongs to them</td><td>their house</td><td>has "heir" (someone who owns)</td></tr>
<tr><td><b>there</b></td><td>a place</td><td>over there</td><td>has "here" inside it</td></tr>
<tr><td><b>they're</b></td><td>they are</td><td>They're late.</td><td>Say "they are" — does it fit?</td></tr>
<tr><td><b>your</b></td><td>belongs to you</td><td>your bag</td><td>"our" is inside — ownership</td></tr>
<tr><td><b>you're</b></td><td>you are</td><td>You're kind.</td><td>Say "you are"</td></tr>
<tr><td><b>its</b></td><td>belongs to it</td><td>its tail</td><td>like his/hers — no apostrophe</td></tr>
<tr><td><b>it's</b></td><td>it is / it has</td><td>It's cold.</td><td>Say "it is"</td></tr>
<tr><td><b>to</b></td><td>direction / before a verb</td><td>go to school, to run</td><td></td></tr>
<tr><td><b>too</b></td><td>also / very much</td><td>me too, too hot</td><td>has too many o's</td></tr>
<tr><td><b>two</b></td><td>the number 2</td><td>two dogs</td><td>tw = twin, twelve</td></tr>
<tr><td><b>then</b></td><td>time / next</td><td>First eat, then play.</td><td>th<b>e</b>n = wh<b>e</b>n</td></tr>
<tr><td><b>than</b></td><td>comparing</td><td>taller than me</td><td>th<b>a</b>n = comp<b>a</b>re</td></tr>
<tr><td><b>whose</b></td><td>belongs to whom</td><td>Whose coat?</td><td></td></tr>
<tr><td><b>who's</b></td><td>who is / who has</td><td>Who's there?</td><td>Say "who is"</td></tr>
<tr><td><b>were</b> / <b>where</b> / <b>we're</b></td><td>past of are / place / we are</td><td>We were late. Where is it? We're here.</td><td>wh<b>ere</b> has "here"</td></tr>
<tr><td><b>lose</b> / <b>loose</b></td><td>misplace / not tight</td><td>Don't lose it. A loose tooth.</td><td>loose has an extra o (loose goose)</td></tr>
<tr><td><b>affect</b> / <b>effect</b></td><td>to change (verb) / a result (noun)</td><td>Rain affects plans. The effect was big.</td><td><b>A</b>ffect = <b>A</b>ction, <b>E</b>ffect = <b>E</b>nd result</td></tr>
<tr><td><b>accept</b> / <b>except</b></td><td>to receive / leaving out</td><td>I accept. Everyone except Sam.</td><td>e<b>x</b>cept = e<b>x</b>clude</td></tr>
</table></div>
<div class="tip">💡 <b>The best trick of all:</b> For any word with an apostrophe, read it as two words (they are, you are, it is, who is). If it doesn't make sense, use the version WITHOUT the apostrophe.</div>
<div class="warn">⚠️ Also watch out for: <b>a lot</b> (two words, never "alot") and <b>should have</b> (never "should of").</div>`,

{t:`The Paragraph & Final Review`, s:`Putting it all together: structure, transitions and editing`,
lesson:`
<h3>The hamburger paragraph 🍔</h3>
<p>A strong paragraph is built like a hamburger:</p>
<div class="tablewrap"><table>
<tr><th>Part</th><th>Job</th><th>Example (opinion: dogs are great pets)</th></tr>
<tr><td><b>🍞 Top bun — Topic sentence</b></td><td>States the main idea</td><td>Dogs make the best pets for three reasons.</td></tr>
<tr><td><b>🥬🍅🥩 Fillings — 3 supporting details</b></td><td>Reasons, facts, examples. Each one explained with 1–2 sentences.</td><td><b>First,</b> dogs are loyal... <b>For example,</b> my dog waits at the door every day. <b>Also,</b> dogs keep you active... <b>Finally,</b> dogs are fun...</td></tr>
<tr><td><b>🍞 Bottom bun — Concluding sentence</b></td><td>Restates the main idea in new words</td><td><b>In conclusion,</b> because they are loyal, active, and fun, dogs are wonderful pets.</td></tr>
</table></div>
<h3>Transition words (the glue)</h3>
<div class="cols">
<div class="ex"><b>Order:</b><div>first, second, next, then, after that, finally</div></div>
<div class="ex"><b>Add:</b><div>also, in addition, another reason, furthermore</div></div>
<div class="ex"><b>Example:</b><div>for example, for instance, such as</div></div>
<div class="ex"><b>Contrast:</b><div>however, on the other hand, but, although</div></div>
<div class="ex"><b>Conclude:</b><div>in conclusion, overall, in the end, as you can see</div></div>
</div>
<h3>The writing process</h3>
<div class="rule"><b>1. Plan</b> (brainstorm and outline) → <b>2. Draft</b> (write it all down) → <b>3. Revise</b> (make it better) → <b>4. Edit</b> (fix mistakes) → <b>5. Publish</b></div>
<div class="cols">
<div class="tip"><b>Revise with ARMS</b> (make it better)<br><b>A</b>dd details · <b>R</b>emove extra words · <b>M</b>ove sentences into a better order · <b>S</b>ubstitute stronger words</div>
<div class="tip"><b>Edit with CUPS</b> (fix mistakes)<br><b>C</b>apitalization · <b>U</b>sage (grammar — subject-verb agreement, pronouns, tense) · <b>P</b>unctuation · <b>S</b>pelling</div>
</div>
<h3>Your 20-day editing checklist</h3>
<div class="ex">
<div>☐ Capitals on names, places, days, and "I" (Days 1, 16)</div>
<div>☐ Plurals without apostrophes; possessives with them (Day 2)</div>
<div>☐ "___ and I" as subject, "___ and me" as object (Day 3)</div>
<div>☐ its / it's, your / you're, their / there / they're (Days 4, 19)</div>
<div>☐ Same tense all the way through; correct irregular verbs (Days 6, 7)</div>
<div>☐ Subjects and verbs agree (Day 8)</div>
<div>☐ good/well; no double negatives (Day 10)</div>
<div>☐ No fragments or run-ons (Day 14)</div>
<div>☐ Mix of simple, compound, and complex sentences (Day 15)</div>
<div>☐ Commas in the right places (Day 17)</div>
</div>`,
quiz:[
[`Which is a proper noun?`,[`ocean`,`Pacific Ocean`,`water`,`wave`],1,`It names a specific ocean. (Day 1)`],
[`"Dad gave the tickets to Ava and ___."`,[`I`,`me`],1,`Cover "Ava and": "gave the tickets to me." (Day 3)`],
[`"The list of chores ___ long."`,[`is`,`are`],0,`The subject is "list" (singular). (Day 8)`],

[`Which is punctuated correctly?`,[`I bought apples, bananas, and grapes.`,`I bought apples bananas and grapes.`,`I bought, apples, bananas, and grapes.`],0,`Commas separate list items. (Day 17)`],

const KEY='grammarQuest20_v1';
let S=load();
function load(){try{const v=JSON.parse(localStorage.getItem(KEY));if(v&&v.days)return v;}catch(e){}return{name:'',days:{}};}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function D(n){if(!S.days[n])S.days[n]={qa:[],qdone:false,fa:[],fr:[],fo:[],fdone:false,wt:'',wc:[]};return S.days[n];}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s).replace(/[\u201C\u201D]/g,'"').replace(/[\u2018\u2019]/g,"'").replace(/\s+/g,' ').replace(/\s+([.,!?;:])/g,'$1').trim();
const words=t=>{t=t.trim();return t?t.split(/\s+/).length:0;};
let curTab='learn';

function quizScore(n){const d=D(n),q=DAYS[n-1].quiz;if(!d.qdone)return null;let c=0;q.forEach((x,i)=>{if(d.qa[i]===x[2])c++;});return {c,t:q.length};}
function fixScore(n){const d=D(n),f=DAYS[n-1].fix;if(!d.fdone)return null;let c=0;f.forEach((x,i)=>{if(d.fr[i]||d.fo[i])c++;});return {c,t:f.length};}
function writeDone(n){const d=D(n),w=DAYS[n-1].write;return words(d.wt)>=w.min && w.list.every((_,i)=>d.wc[i]);}
function dayPct(n){let p=0;const q=quizScore(n),f=fixScore(n);if(q)p+=40*q.c/q.t;if(f)p+=30*f.c/f.t;const d=D(n);if(writeDone(n))p+=30;else if(words(d.wt)>0)p+=Math.min(15,15*words(d.wt)/DAYS[n-1].write.min);return Math.round(p);}
function dayStatus(n){const q=!!quizScore(n),f=!!fixScore(n),w=writeDone(n);if(q&&f&&w)return '⭐';if(q||f||w||words(D(n).wt))return '◐';return '';}

function renderSide(active){
  let h='';
  const weeks=['Week 1 · Parts of speech','Week 2 · Verbs & describers','Week 3 · Sentences','Week 4 · Punctuation & writing'];
  DAYS.forEach((d,i)=>{const n=i+1;if(i%5===0)h+=`<li class="weekhdr">${weeks[i/5]}</li>`;
    h+=`<li><a href="#day-${n}" class="${active===n?'active':''}"><span class="num">${n}</span><span>${esc(d.t)}</span><span class="st">${dayStatus(n)}</span></a></li>`;});

}

function renderHome(){
  const done=DAYS.filter((_,i)=>dayStatus(i+1)==='⭐').length;
  const avg=Math.round(DAYS.reduce((a,_,i)=>a+dayPct(i+1),0)/20);

    <div class="chips"><span class="chip ${q?'on':''}">Quiz ${q?q.c+'/'+q.t:''}</span><span class="chip ${f?'on':''}">Fix-it ${f?f.c+'/'+f.t:''}</span><span class="chip ${w?'on':''}">Writing</span></div></a>`;});
  document.getElementById('main').innerHTML=`
  <div class="card hero"><span class="pill">Grade 6 · 20-day course</span>
    <h1>Grammar Quest${S.name?', '+esc(S.name):''}! ✏️</h1>
    <p>Twenty short lessons that take you from "What is a noun?" all the way to writing a strong, well-edited paragraph. Every day has a lesson, a grammar quiz, a "fix-it" editing challenge, and a writing task.</p>

  </div>

    <div><b>Student name</b><div class="row" style="margin-top:6px"><input type="text" id="nm" placeholder="Type your name" value="${esc(S.name)}"><button class="btn small" id="nmSave">Save</button></div></div>
    <div class="row" style="gap:24px"><div><div class="muted" style="font-size:13px">Days completed</div><b style="font-size:26px;font-family:Fraunces">${done} / 20</b></div><div><div class="muted" style="font-size:13px">Overall progress</div><b style="font-size:26px;font-family:Fraunces">${avg}%</b></div></div>

function firstUnfinished(){for(let i=1;i<=20;i++)if(dayStatus(i)!=='⭐')return i;return 20;}

function renderDay(n){
  const d=DAYS[n-1],st=D(n);
  const q=quizScore(n),f=fixScore(n),w=writeDone(n);

  <div class="dayhead"><div><span class="pill">Day ${n} of 20</span><h2 style="margin-top:8px">${esc(d.t)}</h2><p class="sub">${esc(d.s)}</p></div>
  <div class="row"><a class="btn ghost small" href="#day-${Math.max(1,n-1)}" ${n===1?'style="visibility:hidden"':''}>← Day ${n-1}</a><a class="btn ghost small" href="#day-${Math.min(20,n+1)}" ${n===20?'style="visibility:hidden"':''}>Day ${n+1} →</a></div></div>
  <div class="tabs" role="tablist">
    <button data-t="learn">📖 Learn</button>

  document.querySelectorAll('.tabs button').forEach(b=>{b.classList.toggle('on',b.dataset.t===curTab);b.onclick=()=>{curTab=b.dataset.t;renderDay(n);window.scrollTo({top:0});};});
  const body=document.getElementById('tabbody');
  if(curTab==='learn')renderLearn(n,body);
  else if(curTab==='quiz')renderQuiz(n,body);
  else if(curTab==='fix')renderFix(n,body);

}
function nextBtns(n,next,label){return `<div class="navbottom noprint"><span></span>${next?`<button class="btn" onclick="curTab='${next}';renderDay(${n});window.scrollTo({top:0})">${label} →</button>`:(n<20?`<a class="btn" href="#day-${n+1}">Go to Day ${n+1} →</a>`:`<a class="btn" href="#report">See my report →</a>`)}</div>`;}

function renderLearn(n,el){el.innerHTML=`<div class="card lesson">${DAYS[n-1].lesson}</div>`+nextBtns(n,'quiz','Take the quiz');}

function renderQuiz(n,el){
  const st=D(n),Q=DAYS[n-1].quiz;
  let h=`<div class="card"><p style="margin-top:0">Choose the best answer for each question. When you are done, press <b>Check my answers</b>.</p>`;
  const sc=quizScore(n);
  if(sc)h+=`<div class="score"><b>${sc.c}/${sc.t}</b><div>${sc.c===sc.t?'Perfect score! 🎉':sc.c/sc.t>=.75?'Great work! Read the explanations for any you missed.':'Good effort. Re-read the lesson and try again — you can retry as many times as you like.'}</div></div>`;
  Q.forEach((x,i)=>{
    h+=`<div class="q"><div class="qt"><span class="qn">${i+1}</span>${esc(x[0])}</div><div class="opts">`;
    x[1].forEach((o,j)=>{let cls='';if(st.qdone){if(j===x[2])cls='right';else if(st.qa[i]===j)cls='wrong';}else if(st.qa[i]===j)cls='sel';
      h+=`<button class="opt ${cls}" data-i="${i}" data-j="${j}" ${st.qdone?'disabled':''}>${esc(o)}</button>`;});
    h+=`</div>`;
    if(st.qdone){const ok=st.qa[i]===x[2];h+=`<div class="why ${ok?'good':'badx'}"><b>${ok?'✔ Correct.':'✘ Not quite.'}</b> ${esc(x[3])}</div>`;}
    h+=`</div>`;});
  h+=`<div class="row">${st.qdone?`<button class="btn orange" id="qRetry">↻ Try again</button>`:`<button class="btn" id="qCheck">Check my answers</button>`}<span class="muted" id="qMsg"></span></div></div>`;
  el.innerHTML=h+(st.qdone?nextBtns(n,'fix','Go to Fix-it'):'');
  el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{st.qa[+b.dataset.i]=+b.dataset.j;save();renderQuiz(n,el);});
  const c=document.getElementById('qCheck');
  if(c)c.onclick=()=>{const miss=Q.filter((_,i)=>st.qa[i]===undefined||st.qa[i]===null).length;
    if(miss&&!c.dataset.ok){document.getElementById('qMsg').textContent=`You skipped ${miss} question${miss>1?'s':''}. Press again to check anyway.`;c.dataset.ok=1;return;}
    st.qdone=true;save();renderSide(n);renderDay(n);};
  const r=document.getElementById('qRetry');
  if(r)r.onclick=()=>{st.qdone=false;st.qa=[];save();renderSide(n);renderDay(n);};
}

function renderFix(n,el){
  const st=D(n),F=DAYS[n-1].fix;
  let h=`<div class="card"><p style="margin-top:0">Each sentence below has mistakes. <b>Rewrite the whole sentence correctly</b> in the box. Tip: press "Copy sentence" to start from the original and fix it.</p>`;
  const sc=fixScore(n);
  if(sc)h+=`<div class="score"><b>${sc.c}/${sc.t}</b><div>${sc.c===sc.t?'All fixed! Excellent editing. 🛠️':'Look at the model answers below to see what changed.'}</div></div>`;
  F.forEach((x,i)=>{
    h+=`<div class="fx"><div class="qt"><span class="qn">${i+1}</span>Fix this sentence:</div><div class="wrongs">${esc(x[0])}</div>
    <textarea rows="2" data-i="${i}" ${st.fdone?'readonly':''} placeholder="Type the corrected sentence here...">${esc(st.fa[i]||'')}</textarea>
    ${st.fdone?'':`<button class="btn ghost small" data-copy="${i}" style="margin-top:8px">Copy sentence</button>`}`;
    if(st.fdone){
      if(st.fr[i])h+=`<div class="res good"><b>✔ Correct!</b> ${esc(x[2])}</div>`;
      else if(st.fo[i])h+=`<div class="res good"><b>✔ Marked correct.</b> Model answer: <b>${esc(x[1][0])}</b></div>`;
      else h+=`<div class="res badx"><b>Compare with the model answer:</b><br>${x[1].map(a=>'✔ '+esc(a)).join('<br>')}<br><span class="muted">${esc(x[2])}</span><br><button class="btn ghost small" data-ov="${i}" style="margin-top:8px">My answer is also correct (parent/teacher check)</button></div>`;
    }
    h+=`</div>`;});
  h+=`<div class="row">${st.fdone?`<button class="btn orange" id="fRetry">↻ Try again</button>`:`<button class="btn" id="fCheck">Check my sentences</button>`}</div></div>`;
  el.innerHTML=h+(st.fdone?nextBtns(n,'write','Go to Writing'):'');
  el.querySelectorAll('textarea').forEach(t=>t.oninput=()=>{st.fa[+t.dataset.i]=t.value;save();});
  el.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>{const i=+b.dataset.copy;let s=F[i][0].replace(/\s*\((many|one)[^)]*\)\s*$/,'').replace(/^(Combine|Fix the comma):\s*/,'');st.fa[i]=s;save();renderFix(n,el);const t=el.querySelector(`textarea[data-i="${i}"]`);t.focus();});
  el.querySelectorAll('[data-ov]').forEach(b=>b.onclick=()=>{st.fo[+b.dataset.ov]=true;save();renderSide(n);renderDay(n);});
  const c=document.getElementById('fCheck');

  const r=document.getElementById('fRetry');
  if(r)r.onclick=()=>{st.fdone=false;st.fr=[];st.fo=[];save();renderSide(n);renderDay(n);};
}

function lint(t){
  const out=[];if(!t.trim())return out;
  if(/(^|[\s"(])i(?=[\s,.!?;:']|$)/.test(t))out.push(`Capitalize "I" when it is a word by itself. (Day 16)`);
  const sents=(t.match(/[^.!?]+[.!?]*["']?/g)||[]).map(s=>s.trim()).filter(Boolean);
  const low=sents.filter(s=>/^["']?[a-z]/.test(s));
  if(low.length)out.push(`${low.length} sentence${low.length>1?'s start':' starts'} with a small letter: "${esc(low[0].slice(0,40))}..." (Day 13)`);
  if(!/[.!?]["']?\s*$/.test(t.trim()))out.push(`End your last sentence with . ! or ? (Day 13)`);
  const longS=sents.filter(s=>words(s)>32);
  if(longS.length)out.push(`One sentence is very long (${words(longS[0])} words). Could it be a run-on? Try splitting it. (Day 14)`);
  const m=t.match(/\b(should|could|would|must|might) of\b/i);if(m)out.push(`Write "${m[1]} have," not "${m[1]} of." (Day 5)`);
  if(/\balot\b/i.test(t))out.push(`"A lot" is two words. (Day 19)`);
  if(/\b(hisself|theirselves|theirself|ourself)\b/i.test(t))out.push(`Use "himself" / "themselves" / "ourselves." (Day 4)`);
  if(/\b(me|him|her|us|them) and \w+ (went|are|were|was|go|played|like|love|did|have|had|will)\b/i.test(t)||/\bme and \w+\b/i.test(t.split(/[.!?]/).map(s=>s.trim().slice(0,12)).join('|')))out.push(`Check your subject pronouns: use "___ and I" (not "me and ___") as a subject. (Day 3)`);
  const rep=t.match(/\b(\w+)\s+\1\b/i);if(rep&&!/^(had|that)$/i.test(rep[1]))out.push(`Repeated word: "${esc(rep[0])}". (Proofreading)`);
  const ca=t.match(/\b(dont|cant|wont|didnt|isnt|doesnt|wasnt|arent|couldnt|shouldnt|wouldnt|im|ive|youre|theyre|thats|whats|lets)\b/i);if(ca)out.push(`"${esc(ca[0])}" needs an apostrophe. (Day 18)`);
  if(/\s[,.!?]/.test(t))out.push(`Remove the space before a comma or period.`);
  if(/\b(they|we|you) was\b/i.test(t))out.push(`Use "were" with they/we/you. (Day 8)`);
  if(/\b(he|she|it) don't\b/i.test(t))out.push(`Use "doesn't" with he/she/it. (Day 8)`);
  if(/\bthen (me|him|her|them|us|I|you|my|his|their|before|ever)\b/i.test(t))out.push(`For comparisons use "than," not "then." (Day 19)`);
  if(/\b(your|its) (welcome|the|a|going|so|very|not|really)\b/i.test(t))out.push(`Check "your/you're" and "its/it's" — read it as "you are" / "it is." (Day 19)`);
  if(/\b(there|their) (is|are|was|were) going\b/i.test(t)||/\b(there|their) going\b/i.test(t))out.push(`"They are going" = they're. (Day 19)`);
  if(/\b(have|has|had) (went|saw|ate|did|wrote|took|ran|swam|began|broke|chose|drank|gave|knew)\b/i.test(t))out.push(`After have/has/had, use the past participle (gone, seen, eaten, done, written...). (Day 7)`);
  if(/\b(brung|bringed|seen it yesterday)\b/i.test(t))out.push(`Use "brought." (Day 7)`);
  if(/\b(don't|didn't|doesn't|won't|can't|never) (have |want |got |see |know )?(no|nothing|nobody|none)\b/i.test(t))out.push(`Double negative? Use only one negative word. (Day 10)`);
  if(/\b(more|most) \w+(er|est)\b/i.test(t))out.push(`Don't use "more/most" with -er/-est. (Day 9)`);
  return out;
}

function renderWrite(n,el){
  const st=D(n),W=DAYS[n-1].write,wc=words(st.wt);
  let h=`<div class="card"><div class="prompt"><b>✍️ Your writing task</b><div style="margin-top:6px">${W.p}</div></div>
  <textarea id="wt" rows="12" placeholder="Start writing here. Your work saves automatically.">${esc(st.wt)}</textarea>
  <div class="row" style="justify-content:space-between;margin-top:8px"><span class="wc" id="wcount">${wc} words (goal: at least ${W.min})</span>
  <button class="btn small" id="coachBtn">🤖 Writing Coach: check my writing</button></div>
  <div id="coach" class="coach"></div>
  <h3>Self-check before you finish</h3><p class="muted" style="margin-top:-6px">Read your writing out loud, then tick each box only when it is true.</p><div class="checks">`;
  W.list.forEach((c,i)=>{h+=`<label><input type="checkbox" data-c="${i}" ${st.wc[i]?'checked':''}><span>${esc(c)}</span></label>`;});
  h+=`</div><div id="wstat"></div><div class="row noprint" style="margin-top:10px"><button class="btn ghost small" id="wPrint">🖨️ Print this writing</button><button class="btn ghost small" id="wClear">Clear and start over</button></div></div>`;
  el.innerHTML=h+nextBtns(n,null);
  const ta=document.getElementById('wt');
  const stat=()=>{const w=words(st.wt),ok=writeDone(n);document.getElementById('wcount').textContent=`${w} words (goal: at least ${W.min})`;
    document.getElementById('wstat').innerHTML=ok?`<div class="res good"><b>⭐ Writing task complete!</b> Show it to a parent or teacher for feedback.</div>`:(w>=W.min?`<div class="res badx">Great length! Now finish your self-check list.</div>`:'');renderSide(n);};
  ta.oninput=()=>{st.wt=ta.value;save();stat();};
  el.querySelectorAll('[data-c]').forEach(c=>c.onchange=()=>{st.wc[+c.dataset.c]=c.checked;save();stat();});
  document.getElementById('coachBtn').onclick=()=>{const L=lint(st.wt),w=words(st.wt),box=document.getElementById('coach');
    if(!w){box.innerHTML=`<div class="res badx">Write something first, then ask the coach.</div>`;return;}
    let msg=L.length?`<div class="res badx"><b>The coach noticed ${L.length} thing${L.length>1?'s':''} to check:</b><ul>${L.map(x=>'<li>'+x+'</li>').join('')}</ul><span class="muted">The coach is a helper, not a teacher — it can miss things and can sometimes be wrong. Always re-read your work yourself.</span></div>`
      :`<div class="res good"><b>✔ The coach didn't find common mistakes.</b> Nice! Now re-read it out loud and use the checklist — the coach can't check everything.</div>`;
    if(w<W.min)msg+=`<div class="res badx">Keep going: you need about ${W.min-w} more words.</div>`;
    box.innerHTML=msg;};
  document.getElementById('wPrint').onclick=()=>{const wdw=window.open('','_blank');if(!wdw)return;wdw.document.write(`<html><head><title>Day ${n} writing</title><style>body{font-family:Georgia,serif;max-width:700px;margin:40px auto;line-height:1.8;font-size:17px}h2{font-family:sans-serif}</style></head><body><h2>Day ${n}: ${esc(DAYS[n-1].t)}</h2><p><b>${esc(S.name||'Student')}</b> · ${new Date().toLocaleDateString()}</p><hr><p>${esc(st.wt).replace(/\n/g,'<br>')}</p><hr><p style="color:#777">Teacher/parent comments:</p><div style="height:160px;border:1px solid #ccc"></div></body></html>`);wdw.document.close();wdw.print();};
  document.getElementById('wClear').onclick=()=>{if(confirm('Erase this writing and the checklist?')){st.wt='';st.wc=[];save();renderWrite(n,el);renderSide(n);}};
  stat();
}

function renderReport(){
  let rows='',tq=0,tqt=0,tf=0,tft=0,tw=0;
  DAYS.forEach((d,i)=>{const n=i+1,q=quizScore(n),f=fixScore(n),w=writeDone(n),wc=words(D(n).wt);
    if(q){tq+=q.c;tqt+=q.t;}if(f){tf+=f.c;tft+=f.t;}if(w)tw++;
    rows+=`<tr><td>${n}</td><td><a href="#day-${n}">${esc(d.t)}</a></td><td>${q?q.c+'/'+q.t:'—'}</td><td>${f?f.c+'/'+f.t:'—'}</td><td>${w?'✔ '+wc+' words':(wc?wc+' words (in progress)':'—')}</td></tr>`;});
  const weak=DAYS.map((d,i)=>({d,q:quizScore(i+1),n:i+1})).filter(x=>x.q&&x.q.c/x.q.t<.75);
  document.getElementById('main').innerHTML=`
  <div class="card"><h2>📊 Progress report${S.name?' — '+esc(S.name):''}</h2>
  <div class="row" style="gap:28px;margin:6px 0 14px">
    <div><div class="muted" style="font-size:13px">Grammar quizzes</div><b style="font-size:24px;font-family:Fraunces">${tqt?Math.round(100*tq/tqt)+'%':'—'}</b></div>
    <div><div class="muted" style="font-size:13px">Fix-it editing</div><b style="font-size:24px;font-family:Fraunces">${tft?Math.round(100*tf/tft)+'%':'—'}</b></div>
    <div><div class="muted" style="font-size:13px">Writing tasks done</div><b style="font-size:24px;font-family:Fraunces">${tw} / 20</b></div>
  </div>
  ${weak.length?`<div class="warn"><b>Topics to review</b> (quiz score below 75%): ${weak.map(x=>`<a href="#day-${x.n}">Day ${x.n} ${esc(x.d.t)}</a>`).join(', ')}</div>`:''}
  <div class="tablewrap"><table class="report"><tr><th>Day</th><th>Topic</th><th>Quiz</th><th>Fix-it</th><th>Writing</th></tr>${rows}</table></div>
  <div class="row noprint" style="margin-top:16px"><button class="btn" onclick="window.print()">🖨️ Print report</button><button class="btn ghost" id="exp">⬇️ Save progress file</button><label class="btn ghost" style="cursor:pointer">⬆️ Load progress file<input type="file" id="imp" accept=".json,application/json" hidden></label><button class="btn ghost" id="rst">Reset everything</button></div>
  <p class="muted noprint" style="font-size:14px">Progress is saved in this browser only. To move to another computer or tablet, use "Save progress file" here and "Load progress file" there.</p>
  </div>
  <div class="card"><h2>All writing</h2>${DAYS.map((d,i)=>D(i+1).wt.trim()?`<h3>Day ${i+1}: ${esc(d.t)}</h3><p style="white-space:pre-wrap;background:var(--bg);padding:12px;border-radius:10px">${esc(D(i+1).wt)}</p>`:'').join('')||'<p class="muted">No writing yet.</p>'}</div>`;
  document.getElementById('exp').onclick=()=>{const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`grammar-quest-${(S.name||'progress').replace(/\W+/g,'-')}.json`;a.click();};
  document.getElementById('imp').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const v=JSON.parse(r.result);if(v&&v.days){S=v;save();renderSide(0);renderReport();alert('Progress loaded!');}else alert('That file does not look right.');}catch(x){alert('Could not read that file.');}};r.readAsText(f);};
  document.getElementById('rst').onclick=()=>{if(confirm('This erases ALL answers and writing for all 20 days. Are you sure?')){S={name:S.name,days:{}};save();renderSide(0);renderReport();}};
}

let CUR='';
function curHash(){try{return location.hash||CUR;}catch(e){return CUR;}}
function go(h){CUR=h;try{history.pushState(null,'',h);}catch(e){}route(h);}
/* Handle all in-page links ourselves so navigation works everywhere:
   GitHub Pages, a local file, or an embedded preview. */
document.addEventListener('click',e=>{const a=e.target.closest('a[href^="#"]');if(!a)return;e.preventDefault();go(a.getAttribute('href'));});
function route(force){
  const h=(typeof force==='string'?force:curHash())||'#home';const m=h.match(/^#day-(\d+)/);
  closeMenu();
  if(m){const n=Math.min(20,Math.max(1,+m[1]));if(route.last!==n)curTab='learn';route.last=n;renderSide(n);renderDay(n);}
  else if(h==='#report'){route.last=0;renderSide(0);renderReport();}
  else{route.last=0;renderSide(0);renderHome();}
  window.scrollTo({top:0});
}
function closeMenu(){document.getElementById('side').classList.remove('open');document.getElementById('scrim').className='';}
document.getElementById('menuBtn').onclick=()=>{document.getElementById('side').classList.add('open');document.getElementById('scrim').className='scrim';};
document.getElementById('scrim').onclick=closeMenu;
document.getElementById('themeBtn').onclick=()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dark?'light':'dark';try{localStorage.setItem(KEY+'_theme',r.dataset.theme);}catch(e){}};
try{const t=localStorage.getItem(KEY+'_theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}
window.addEventListener('hashchange',()=>{CUR=location.hash;route();});
window.addEventListener('popstate',()=>{CUR=location.hash;route();});
route();
</script>
