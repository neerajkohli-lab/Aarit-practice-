<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grammar Quest: 20 Days</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ef; --panel:#ffffff; --ink:#1f2433; --muted:#636a7d; --line:#e4e0d6;
  --brand:#2f5bea; --brand-soft:#e8eeff; --accent:#ff8a3d; --accent-soft:#fff1e6;
  --ok:#17915a; --ok-soft:#e3f6ec; --bad:#d23c3c; --bad-soft:#fdeaea;
  --tip:#7a4fd6; --tip-soft:#f1ebff; --warn:#b7791f; --warn-soft:#fff6dd;
  --shadow:0 1px 2px rgba(20,24,40,.06),0 6px 24px rgba(20,24,40,.06);
  --radius:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14161d; --panel:#1d2029; --ink:#eceef4; --muted:#a2a8b8; --line:#2e3240;
    --brand:#7c9bff; --brand-soft:#232b47; --accent:#ffa366; --accent-soft:#3a2a1e;
    --ok:#4cd391; --ok-soft:#183427; --bad:#ff7a7a; --bad-soft:#3a1d1f;
    --tip:#b89bff; --tip-soft:#2a2340; --warn:#f0c060; --warn-soft:#352c17;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#14161d; --panel:#1d2029; --ink:#eceef4; --muted:#a2a8b8; --line:#2e3240;
  --brand:#7c9bff; --brand-soft:#232b47; --accent:#ffa366; --accent-soft:#3a2a1e;
  --ok:#4cd391; --ok-soft:#183427; --bad:#ff7a7a; --bad-soft:#3a1d1f;
  --tip:#b89bff; --tip-soft:#2a2340; --warn:#f0c060; --warn-soft:#352c17;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Lexend,system-ui,sans-serif;font-size:17px;line-height:1.65;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:Fraunces,Georgia,serif;line-height:1.2;margin:0 0 .5em}
h1{font-size:clamp(28px,5vw,44px);font-weight:800}
h2{font-size:clamp(22px,3.4vw,30px)}
h3{font-size:20px;margin-top:1.4em}
a{color:var(--brand)}
button{font-family:inherit;font-size:15px;cursor:pointer}
.app{display:grid;grid-template-columns:280px 1fr;min-height:100vh}
/* Sidebar */
.side{background:var(--panel);border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.logo{display:flex;align-items:center;gap:10px;padding:4px 8px 16px;text-decoration:none;color:var(--ink)}
.logo .mark{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--brand),var(--accent));display:grid;place-items:center;color:#fff;font-family:Fraunces,serif;font-weight:800;font-size:20px}
.logo b{font-family:Fraunces,serif;font-size:19px;display:block;line-height:1.1}
.logo small{color:var(--muted);font-size:12px}
.navhome{display:flex;gap:8px;margin:0 4px 14px}
.navhome a{flex:1;text-align:center;padding:8px;border-radius:10px;background:var(--brand-soft);color:var(--brand);text-decoration:none;font-size:14px;font-weight:500}
.daylist{list-style:none;margin:0;padding:0}
.daylist a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;color:var(--ink);text-decoration:none;font-size:14.5px}
.daylist a:hover{background:var(--bg)}
.daylist a.active{background:var(--brand);color:#fff}
.daylist .num{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--bg);font-weight:600;font-size:13px;flex-shrink:0}
.daylist a.active .num{background:rgba(255,255,255,.22)}
.daylist .st{margin-left:auto;font-size:13px}
.weekhdr{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:14px 10px 4px;font-weight:600}
/* Main */
.main{padding:28px clamp(16px,4vw,48px) 80px;max-width:980px;width:100%}
.topbar{display:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:clamp(18px,3vw,30px);box-shadow:var(--shadow);margin-bottom:20px}
.hero{background:linear-gradient(135deg,var(--brand) 0%,#5b3fd6 60%,var(--accent) 140%);color:#fff;border:none}
.hero p{opacity:.92;max-width:640px}
.hero h1{color:#fff}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--brand-soft);color:var(--brand);font-size:12.5px;font-weight:600}
.hero .pill{background:rgba(255,255,255,.2);color:#fff}
.btn{border:none;border-radius:11px;padding:10px 18px;background:var(--brand);color:#fff;font-weight:500;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.btn.orange{background:var(--accent)}
.btn.small{padding:6px 12px;font-size:13.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.dcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;text-decoration:none;color:var(--ink);display:block;transition:transform .12s, box-shadow .12s}
.dcard:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.dcard .n{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.dcard .t{font-weight:600;margin:2px 0 8px;line-height:1.3}
.bar{height:6px;background:var(--bg);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--accent));border-radius:9px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--bg);color:var(--muted)}
.chip.on{background:var(--ok-soft);color:var(--ok)}
input[type=text]{font-family:inherit;font-size:16px;padding:10px 14px;border-radius:11px;border:1px solid var(--line);background:var(--panel);color:var(--ink);min-width:0}
/* Day header + tabs */
.dayhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.dayhead .sub{color:var(--muted);margin:-4px 0 0}
.tabs{display:flex;gap:6px;background:var(--panel);border:1px solid var(--line);padding:6px;border-radius:14px;margin-bottom:18px;overflow-x:auto;position:sticky;top:8px;z-index:5;box-shadow:var(--shadow)}
.tabs button{flex:1;border:none;background:none;padding:10px 12px;border-radius:10px;color:var(--muted);font-weight:500;white-space:nowrap}
.tabs button.on{background:var(--brand);color:#fff}
.tabs button .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-left:6px;vertical-align:middle}
/* Lesson blocks */
.lesson p{margin:.6em 0}
.rule{border-left:5px solid var(--brand);background:var(--brand-soft);padding:12px 16px;border-radius:0 12px 12px 0;margin:14px 0}
.tip{border-left:5px solid var(--tip);background:var(--tip-soft);padding:12px 16px;border-radius:0 12px 12px 0;margin:14px 0}
.warn{border-left:5px solid var(--warn);background:var(--warn-soft);padding:12px 16px;border-radius:0 12px 12px 0;margin:14px 0}
.ex{background:var(--bg);border-radius:12px;padding:10px 14px;margin:10px 0}
.ex div{padding:3px 0}
.y{color:var(--ok);font-weight:700;margin-right:6px}
.n{color:var(--bad);font-weight:700;margin-right:6px}
mark{background:var(--accent-soft);color:var(--ink);padding:0 4px;border-radius:5px;font-weight:600}
.lesson table{width:100%;border-collapse:collapse;margin:12px 0;font-size:15.5px}
.lesson th,.lesson td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.lesson th{background:var(--bg)}
.tablewrap{overflow-x:auto}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
/* Quiz */
.q{border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;background:var(--panel)}
.q .qt{font-weight:500;margin-bottom:10px}
.q .qn{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;background:var(--brand-soft);color:var(--brand);font-size:13px;font-weight:700;margin-right:8px}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:2px solid var(--line);background:var(--panel);color:var(--ink);padding:10px 14px;border-radius:11px;font-size:16px;line-height:1.4}
.opt:hover:not(:disabled){border-color:var(--brand)}
.opt.sel{border-color:var(--brand);background:var(--brand-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.why{margin-top:10px;padding:10px 14px;border-radius:10px;font-size:15px}
.why.good{background:var(--ok-soft)} .why.badx{background:var(--bad-soft)}
.score{display:flex;align-items:center;gap:16px;padding:16px 20px;border-radius:14px;margin:14px 0;background:var(--brand-soft)}
.score b{font-family:Fraunces,serif;font-size:34px;color:var(--brand)}
/* Fix-it */
.fx{border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.wrongs{font-size:17px;background:var(--bad-soft);padding:8px 12px;border-radius:10px;margin:6px 0 10px;font-family:Lexend}
textarea{width:100%;font-family:inherit;font-size:16.5px;line-height:1.6;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);resize:vertical}
textarea:focus,input:focus{outline:2px solid var(--brand);outline-offset:1px}
.res{margin-top:10px;padding:10px 14px;border-radius:10px;font-size:15px}
.res.good{background:var(--ok-soft)} .res.badx{background:var(--warn-soft)}
/* Writing */
.prompt{background:var(--accent-soft);border-radius:14px;padding:16px 18px;margin-bottom:14px}
.wc{font-size:14px;color:var(--muted)}
.checks label{display:flex;gap:10px;align-items:flex-start;padding:6px 0;cursor:pointer}
.checks input{width:20px;height:20px;margin-top:3px;accent-color:var(--ok);flex-shrink:0}
.coach{margin-top:12px}
.coach li{margin:4px 0}
.passage{background:var(--bg);border-radius:12px;padding:12px 16px;font-style:italic;margin:10px 0}
.navbottom{display:flex;justify-content:space-between;gap:10px;margin-top:20px}
.muted{color:var(--muted)}
table.report{width:100%;border-collapse:collapse;font-size:14.5px}
table.report th,table.report td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left}
.hide{display:none!important}
.themebtn{position:fixed;right:16px;bottom:16px;z-index:20;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--ink);box-shadow:var(--shadow);font-size:18px}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:290px;z-index:30;transform:translateX(-100%);transition:transform .2s;box-shadow:var(--shadow)}
  .side.open{transform:none}
  .topbar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
  .topbar b{font-family:Fraunces,serif}
  .tabs{top:58px}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:25}
}
@media print{
  .side,.topbar,.tabs,.themebtn,.btn,.noprint{display:none!important}
  .app{display:block} body{background:#fff;color:#000}
  .card{box-shadow:none;border:1px solid #ccc}
}
</style>
</head>
<body>
<div class="topbar"><button class="btn ghost small" id="menuBtn" aria-label="Open menu">☰ Days</button><b>Grammar Quest</b></div>
<div class="app">
  <aside class="side" id="side">
    <a class="logo" href="#home"><span class="mark">G</span><span><b>Grammar Quest</b><small>20 days to stronger writing</small></span></a>
    <div class="navhome"><a href="#home">🏠 Home</a><a href="#report">📊 Report</a></div>
    <ul class="daylist" id="daylist"></ul>
  </aside>
  <main class="main" id="main"></main>
</div>

<button class="themebtn" id="themeBtn" title="Switch light/dark">◐</button>

<script>
/* ============================================================
   COURSE CONTENT
   quiz: [question, [options], correctIndex, explanation]
   fix:  [sentence with mistakes, [accepted answers], tip]
   ============================================================ */
const DAYS = [
/* ---------------- DAY 1 ---------------- */
{t:`Nouns: The Naming Words`, s:`What is a noun? Common, proper, concrete, abstract and collective nouns`,
lesson:`
<h3>What is a noun?</h3>
<p>A <mark>noun</mark> is a word that <b>names</b> something. Every noun names one of four things:</p>
<div class="cols">
<div class="ex"><b>👤 A person</b><div>teacher, mom, Sam, doctor</div></div>
<div class="ex"><b>📍 A place</b><div>school, park, Boston, kitchen</div></div>
<div class="ex"><b>📦 A thing</b><div>pencil, dog, car, pizza</div></div>
<div class="ex"><b>💭 An idea</b><div>love, fear, courage, freedom</div></div>
</div>
<div class="tip">💡 <b>The "the" test:</b> If you can put <i>the</i>, <i>a</i>, or <i>an</i> in front of a word and it makes sense, it is probably a noun. <i>the teacher</i> ✔, <i>a dog</i> ✔, <i>the quickly</i> ✘.</div>

<h3>1. Common nouns and proper nouns</h3>
<div class="rule"><b>Common noun</b> = a general name (starts with a small letter): <i>city, boy, day, school</i><br>
<b>Proper noun</b> = the special name of ONE particular person, place or thing. It ALWAYS starts with a <b>capital letter</b>: <i>Boston, Arjun, Monday, Lincoln Middle School</i></div>
<div class="tablewrap"><table><tr><th>Common noun</th><th>Proper noun</th></tr>
<tr><td>city</td><td>New York</td></tr><tr><td>day</td><td>Saturday</td></tr><tr><td>month</td><td>October</td></tr><tr><td>teacher</td><td>Mrs. Garcia</td></tr><tr><td>holiday</td><td>Diwali, Thanksgiving</td></tr><tr><td>river</td><td>Mississippi River</td></tr></table></div>

<h3>2. Concrete nouns and abstract nouns</h3>
<div class="rule"><b>Concrete noun</b> = something you can see, hear, touch, smell or taste: <i>apple, music, rock, rain</i><br>
<b>Abstract noun</b> = an idea, feeling or quality you can NOT touch: <i>happiness, honesty, courage, friendship, fear</i></div>

<h3>3. Collective nouns</h3>
<div class="rule">A <b>collective noun</b> names a <b>group</b> as one unit: <i>team, class, family, flock (of birds), herd (of cows), pack (of wolves), swarm (of bees)</i></div>

<h3>Let's find the nouns</h3>
<div class="ex"><div>The <mark>girl</mark> put her <mark>book</mark> on the <mark>desk</mark>. → 3 nouns</div>
<div><mark>Priya</mark> showed great <mark>courage</mark> at the <mark>competition</mark>. → 3 nouns (one proper, one abstract, one common)</div></div>
<div class="warn">⚠️ <b>Common mistake:</b> forgetting capital letters on proper nouns. <span class="n">✘</span> my friend sam lives in texas. <span class="y">✔</span> My friend Sam lives in Texas.</div>`,
quiz:[
[`Which word is a noun?`,[`run`,`happy`,`teacher`,`quickly`],2,`A teacher is a person, so "teacher" is a noun.`],
[`Find the proper noun: "We visited Boston last summer."`,[`visited`,`Boston`,`summer`,`We`],1,`Boston is the name of one specific city, so it is a proper noun with a capital letter.`],
[`Which is an abstract noun (an idea or feeling you cannot touch)?`,[`table`,`river`,`courage`,`dog`],2,`You cannot touch courage. It is a quality, so it is abstract.`],
[`Which is a collective noun (a name for a group)?`,[`flock`,`bird`,`feather`,`nest`],0,`A flock is a group of birds.`],
[`How many nouns are in this sentence? "The girl put her book on the desk."`,[`1`,`2`,`3`,`4`],2,`girl, book, desk = 3 nouns.`],
[`Which word should ALWAYS start with a capital letter?`,[`city`,`teacher`,`school`,`monday`],3,`Days of the week are proper nouns: Monday.`],
[`In "Honesty is important," the word "Honesty" is a(n)...`,[`proper noun`,`abstract noun`,`collective noun`,`verb`],1,`Honesty is a quality you cannot touch, so it is an abstract noun.`],
[`Which word is NOT a noun?`,[`freedom`,`Atlanta`,`quietly`,`pencil`],2,`"Quietly" describes HOW something is done. It is an adverb, not a naming word.`]
],
fix:[
[`my friend sam lives in new york.`,[`My friend Sam lives in New York.`],`Capitalize the first word, the person's name, and the city.`],
[`we saw the statue of liberty on saturday.`,[`We saw the Statue of Liberty on Saturday.`],`The name of a famous place and a day of the week are proper nouns. ("of" stays small.)`],
[`on tuesday, mrs. lee read us a book.`,[`On Tuesday, Mrs. Lee read us a book.`],`First word, day of the week, and a person's title + name all need capitals.`]
],
write:{p:`Describe your favorite place (your room, a park, a restaurant, a city you visited) in <b>5 to 7 sentences</b>. Use at least <b>3 proper nouns</b> and <b>2 abstract nouns</b> (like <i>joy, peace, excitement</i>). At the end, write a list: "My proper nouns: ... My abstract nouns: ..."`,
list:[`I wrote 5 to 7 complete sentences.`,`I used at least 3 proper nouns, and each one has a capital letter.`,`I used at least 2 abstract nouns.`,`I listed my nouns at the end.`,`Every sentence starts with a capital letter and ends with . ! or ?`],min:60}
},
/* ---------------- DAY 2 ---------------- */
{t:`Plural & Possessive Nouns`, s:`More than one, and showing who owns something`,
lesson:`
<h3>Singular and plural</h3>
<p><b>Singular</b> means one (<i>cat</i>). <b>Plural</b> means more than one (<i>cats</i>). English has a few rules for making plurals:</p>
<div class="tablewrap"><table>
<tr><th>Rule</th><th>Examples</th></tr>
<tr><td>Most nouns: add <b>-s</b></td><td>book → books, dog → dogs</td></tr>
<tr><td>Ends in <b>s, x, z, ch, sh</b>: add <b>-es</b></td><td>bus → buses, box → boxes, lunch → lunches, wish → wishes</td></tr>
<tr><td>Consonant + <b>y</b>: change y to <b>i</b>, add <b>-es</b></td><td>baby → babies, city → cities, puppy → puppies</td></tr>
<tr><td>Vowel (a, e, i, o, u) + <b>y</b>: just add <b>-s</b></td><td>boy → boys, key → keys, monkey → monkeys</td></tr>
<tr><td>Many words ending in <b>f / fe</b>: change to <b>-ves</b></td><td>leaf → leaves, knife → knives, wolf → wolves</td></tr>
<tr><td><b>Irregular</b> (must memorize)</td><td>child → children, man → men, woman → women, mouse → mice, tooth → teeth, foot → feet, person → people</td></tr>
<tr><td><b>Same</b> in singular and plural</td><td>sheep, deer, fish, moose</td></tr>
</table></div>

<h3>Possessive nouns (showing ownership)</h3>
<p>A <mark>possessive noun</mark> shows that something <b>belongs</b> to someone. We use an <b>apostrophe ( ' )</b>.</p>
<div class="rule"><b>Rule 1 — One owner:</b> add <b>'s</b> → the dog<b>'s</b> bone (one dog), Sam<b>'s</b> bike, the teacher<b>'s</b> desk<br>
<b>Rule 2 — Many owners, plural already ends in s:</b> add only <b>'</b> → the dog<b>s'</b> bones (many dogs), the student<b>s'</b> lockers<br>
<b>Rule 3 — Plural that does NOT end in s:</b> add <b>'s</b> → the children<b>'s</b> toys, the men<b>'s</b> team</div>
<div class="tip">💡 <b>Trick:</b> First write the owner (one or many). Then ask: does it end in <b>s</b>? If it is plural and ends in s, just add <b>'</b>. Otherwise add <b>'s</b>.</div>
<div class="warn">⚠️ <b>The #1 mistake:</b> Never use an apostrophe just to make a word plural!<br><span class="n">✘</span> I bought three apple's. <span class="y">✔</span> I bought three apples.</div>`,
quiz:[
[`Plural of "box"?`,[`boxs`,`boxes`,`boxies`,`box's`],1,`Words ending in x add -es.`],
[`Plural of "baby"?`,[`babys`,`babyes`,`babies`,`baby's`],2,`Consonant + y: change y to i and add -es.`],
[`Plural of "leaf"?`,[`leafs`,`leaves`,`leafes`,`leave`],1,`leaf → leaves (f changes to ves).`],
[`Plural of "child"?`,[`childs`,`childes`,`childrens`,`children`],3,`Child is irregular: children. ("childrens" is never correct.)`],
[`Plural of "monkey"?`,[`monkies`,`monkeys`,`monkeyes`,`monkey's`],1,`Vowel (e) + y: just add -s.`],
[`The bone belongs to ONE dog. Which is correct?`,[`the dogs bone`,`the dog's bone`,`the dogs' bone`,`the dogs's bone`],1,`One owner → add 's.`],
[`The lockers belong to MANY students. Which is correct?`,[`the student's lockers`,`the students lockers`,`the students' lockers`,`the students's lockers`],2,`Plural ending in s → add only an apostrophe.`],
[`Which sentence is correct?`,[`I bought three apple's.`,`I bought three apples.`,`I bought three apples'.`,`I bought three applies.`],1,`Plurals do not need apostrophes.`]
],
fix:[
[`The boys bikes were in the garage. (many boys)`,[`The boys' bikes were in the garage.`],`Many boys own the bikes. Plural ends in s, so add only '. (Don't type the hint in brackets.)`],
[`I have two puppys and three kitten's.`,[`I have two puppies and three kittens.`],`puppy → puppies (consonant + y). Plurals have no apostrophe.`],
[`The childrens' coats are wet.`,[`The children's coats are wet.`],`"Children" is already plural and does not end in s, so add 's.`]
],

/* ---------------- DAY 3 ---------------- */
{t:`Pronouns, Part 1`, s:`Words that replace nouns: subject and object pronouns`,
lesson:`
<h3>What is a pronoun?</h3>
<p>A <mark>pronoun</mark> is a word that <b>takes the place of a noun</b>, so we don't repeat the same noun again and again.</p>
<div class="ex"><div><span class="n">✘</span> Maya lost Maya's pencil, so Maya borrowed one.</div><div><span class="y">✔</span> Maya lost <mark>her</mark> pencil, so <mark>she</mark> borrowed one.</div></div>

<h3>Subject pronouns vs. object pronouns</h3>
<div class="tablewrap"><table>
<tr><th>Subject pronouns<br><small>(DO the action — usually before the verb)</small></th><th>Object pronouns<br><small>(RECEIVE the action — after the verb or after words like to, for, with, between)</small></th></tr>
<tr><td>I</td><td>me</td></tr><tr><td>you</td><td>you</td></tr><tr><td>he / she / it</td><td>him / her / it</td></tr><tr><td>we</td><td>us</td></tr><tr><td>they</td><td>them</td></tr>
</table></div>
<div class="ex"><div><mark>She</mark> called <mark>me</mark>. → "She" does the calling (subject); "me" receives it (object).</div><div><mark>They</mark> gave the gift to <mark>us</mark>.</div></div>

<h3>The "cover-up" trick for two people</h3>
<p>Mistakes happen most when there are TWO people. Cover up the other person and listen:</p>
<div class="ex"><div>Jake and (I / me) went to the park. → Cover "Jake and": <i>me went</i>? ✘ <i>I went</i>? ✔ → <b>Jake and I went to the park.</b></div>
<div>Mom drove Jake and (I / me). → Cover "Jake and": <i>Mom drove I</i>? ✘ <i>Mom drove me</i>? ✔ → <b>Mom drove Jake and me.</b></div></div>
<div class="rule"><b>Politeness rule:</b> Always put yourself <b>last</b>. Say "My sister and I," not "I and my sister" or "Me and my sister."</div>
<div class="warn">⚠️ After <b>between, to, for, with</b> use object pronouns: "between you and <b>me</b>" (not "between you and I").</div>
<div class="tip">💡 "<b>We</b> students" or "<b>us</b> students"? Cover "students": <i>We are tired</i> ✔ → "We students are tired." <i>The teacher helped us</i> ✔ → "The teacher helped us students."</div>`,
quiz:[
[`Which pronoun can replace "Sara" in "Sara likes pizza"?`,[`Her`,`She`,`Hers`,`Herself`],1,`Sara is the subject (she does the liking), so use the subject pronoun "She."`],
[`"Please give the ball to ___." (Tom)`,[`he`,`him`,`his`,`himself`],1,`After "to," use the object pronoun "him."`],
[`"Jake and ___ played chess."`,[`me`,`I`,`myself`,`mine`],1,`Cover "Jake and": "I played chess." ✔`],
[`"The teacher called Mia and ___ to the front."`,[`I`,`me`,`myself`,`mine`],1,`Cover "Mia and": "The teacher called me." ✔`],
[`"This secret is between you and ___."`,[`I`,`me`,`myself`,`mine`],1,`After "between," use an object pronoun: me.`],
[`Which one is a SUBJECT pronoun?`,[`them`,`us`,`they`,`him`],2,`"They" is a subject pronoun. The others are object pronouns.`],
[`"___ students want a longer recess."`,[`Us`,`We`,`Our's`,`Ourselves`],1,`Cover "students": "We want..." ✔`],
[`Which sentence is polite AND correct?`,[`Me and my mom baked a cake.`,`I and my mom baked a cake.`,`My mom and I baked a cake.`,`My mom and me baked a cake.`],2,`Subject pronoun "I," and put yourself last.`]
],
fix:[
[`Me and Jake went to the park.`,[`Jake and I went to the park.`],`Use "I" as a subject, and put yourself last.`],
[`The coach gave the trophy to Lily and I.`,[`The coach gave the trophy to Lily and me.`],`After "to," use the object pronoun "me."`],
[`Her and me are best friends.`,[`She and I are best friends.`],`Both people are subjects: "She and I."`]
],
write:{p:`Write <b>6 to 8 sentences</b> about something fun you did with a friend or sibling. Use "<b>___ and I</b>" as a subject at least <b>twice</b> and "<b>___ and me</b>" as an object at least <b>twice</b> (for example: <i>Dad took Aarav and me to the game</i>). Use the cover-up trick to check each one.`,
list:[`I used "___ and I" correctly at least twice.`,`I used "___ and me" correctly at least twice.`,`I put myself last every time.`,`I used pronouns so I didn't repeat names too much.`,`Every sentence starts with a capital and ends with punctuation.`],min:70}
},
/* ---------------- DAY 4 ---------------- */
{t:`Pronouns, Part 2`, s:`Possessive and reflexive pronouns, and pronoun agreement`,
lesson:`
<h3>Possessive pronouns (ownership — with NO apostrophe!)</h3>
<div class="tablewrap"><table>
<tr><th>Before a noun</th><th>Stands alone</th></tr>
<tr><td>my book</td><td>The book is <b>mine</b>.</td></tr>
<tr><td>your coat</td><td>The coat is <b>yours</b>.</td></tr>
<tr><td>his bike / her bike</td><td>It is <b>his</b>. / It is <b>hers</b>.</td></tr>
<tr><td>its tail</td><td>—</td></tr>
<tr><td>our house</td><td>The house is <b>ours</b>.</td></tr>
<tr><td>their dog</td><td>The dog is <b>theirs</b>.</td></tr>
</table></div>
<div class="warn">⚠️ Possessive pronouns NEVER use apostrophes: <span class="n">✘</span> your's, her's, our's, their's, it's tail. <span class="y">✔</span> yours, hers, ours, theirs, its tail.<br><b>it's</b> only means "it is" or "it has."</div>

<h3>Reflexive pronouns (-self / -selves)</h3>
<p>Use them when the subject does something <b>to itself</b>, or for <b>emphasis</b>.</p>
<div class="ex"><div>I taught <mark>myself</mark> to ride a bike. · She made it <mark>herself</mark>. · They cleaned up <mark>themselves</mark>.</div></div>
<div class="rule">myself · yourself · himself · herself · itself · ourselves · yourselves · themselves</div>
<div class="warn">⚠️ <b>"hisself," "theirselves," and "theirself" are NOT words.</b> Also, don't use "myself" as a subject: <span class="n">✘</span> Myself and Tom will go. <span class="y">✔</span> Tom and I will go.</div>

<h3>Antecedents: who is the pronoun talking about?</h3>
<p>The <mark>antecedent</mark> is the noun a pronoun replaces. They must <b>match</b> (one/many, he/she/it).</p>
<div class="ex"><div>The <b>tree</b> lost <mark>its</mark> leaves. (tree = one thing → its)</div><div>The <b>students</b> finished <mark>their</mark> projects. (students = many → their)</div></div>
<div class="tip">💡 <b>Be clear!</b> "When Max met Leo, <i>he</i> smiled." Who smiled? We can't tell. Better: "Max smiled when he met Leo."</div>`,
quiz:[
[`"That book is ___." (it belongs to me)`,[`my`,`mine`,`mine's`,`me`],1,`"Mine" stands alone without a noun after it.`],
[`"The dog wagged ___ tail."`,[`it's`,`its'`,`its`,`it`],2,`Possessive "its" has no apostrophe. "It's" means "it is."`],
[`Which sentence is correct?`,[`He built the fort by hisself.`,`He built the fort by himself.`,`He built the fort by his self.`,`He built the fort by him.`],1,`"Hisself" is not a word. Use "himself."`],
[`Which is NOT a real word?`,[`themselves`,`ourselves`,`theirselves`,`yourselves`],2,`"Theirselves" is incorrect. Use "themselves."`],
[`Which sentence is correct?`,[`Myself and Tom will lead the group.`,`Tom and myself will lead the group.`,`Tom and I will lead the group.`,`Tom and me will lead the group.`],2,`Use the subject pronoun "I." Don't use "myself" as a subject.`],
[`"The students finished ___ projects."`,[`there`,`their`,`they're`,`theirs`],1,`"Their" shows ownership before a noun.`],
[`In "The tree lost its leaves," what is the antecedent of "its"?`,[`leaves`,`lost`,`tree`,`The`],2,`"Its" refers back to the tree.`],
[`Which sentence is UNCLEAR (we can't tell who the pronoun means)?`,[`When Max met Leo, he smiled.`,`Max smiled when he met Leo.`,`When Max met Leo, Max smiled.`,`Leo smiled at Max.`],0,`"He" could be Max or Leo, so the sentence is unclear.`]
],
fix:[
[`The cat licked it's paw.`,[`The cat licked its paw.`],`Possessive "its" has no apostrophe.`],
[`Is this pencil your's?`,[`Is this pencil yours?`],`Possessive pronouns never use apostrophes.`],
[`They did the whole project theirselves.`,[`They did the whole project themselves.`],`"Theirselves" is not a word.`]
],
write:{p:`Write <b>6 to 8 sentences</b> about a time you did something all by yourself for the first time (cooking, a project, a trip). Use at least <b>3 possessive pronouns</b> (my, his, mine, theirs...) and at least <b>2 reflexive pronouns</b> (myself, himself, ourselves...). Make sure every pronoun clearly matches its noun.`,
list:[`I used at least 3 possessive pronouns with NO apostrophes.`,`I used at least 2 reflexive pronouns correctly.`,`Each pronoun clearly refers to one person or thing.`,`I did not write "hisself" or "theirselves."`,`My sentences are complete with correct punctuation.`],min:70}
},
/* ---------------- DAY 5 ---------------- */
{t:`Verbs: Action, Linking & Helping`, s:`The engine of every sentence`,
lesson:`
<h3>What is a verb?</h3>
<p>A <mark>verb</mark> tells what the subject <b>does</b> or what the subject <b>is</b>. Every sentence must have a verb.</p>
<h3>1. Action verbs</h3>
<div class="rule">Show an action — something you can do: <i>run, jump, write, think, eat, laugh, build, wonder</i>.<br>The frog <mark>jumped</mark> into the pond.</div>
<h3>2. Linking verbs</h3>
<div class="rule">Do NOT show action. They <b>link</b> the subject to a word that describes or renames it.<br>Forms of <b>be</b>: am, is, are, was, were, be, being, been<br>Sense & state verbs: seem, become, feel, look, smell, taste, sound, appear</div>
<div class="ex"><div>The soup <mark>smells</mark> delicious. (soup = delicious)</div><div>She <mark>is</mark> a great singer. (She = singer)</div></div>
<div class="tip">💡 <b>Test:</b> Replace the verb with "is" or "=". If it still makes sense, it is linking. "I <i>feel</i> tired" → "I am tired" ✔ (linking). "I <i>feel</i> the soft fur" → "I am the soft fur" ✘ (action).</div>
<h3>3. Helping verbs</h3>
<div class="rule">Come <b>before</b> the main verb to help it: am, is, are, was, were, has, have, had, do, does, did, can, could, will, would, shall, should, may, might, must.<br>Together they make a <b>verb phrase</b>: She <mark>has finished</mark>. They <mark>will be singing</mark>. (main verb = singing)</div>
<div class="warn">⚠️ <b>"should of" is wrong!</b> It sounds like "should've" but it is <b>should have</b>. Same for could have, would have, must have.</div>
<h3>Strong verbs make strong writing</h3>
<div class="ex"><div><span class="n">Weak:</span> The horse <i>went</i> across the field.</div><div><span class="y">Strong:</span> The horse <i>galloped</i> across the field.</div></div>
<p>Try to replace boring verbs like <i>went, got, did, said, made</i> with exact ones: <i>raced, grabbed, whispered, built, shouted</i>.</p>`,
quiz:[
[`Find the action verb: "The frog jumped into the pond."`,[`frog`,`jumped`,`into`,`pond`],1,`"Jumped" is the action.`],
[`Find the linking verb: "The soup smells delicious."`,[`soup`,`smells`,`delicious`,`The`],1,`"Smells" links soup to delicious (soup is delicious).`],
[`Find the helping verb: "She has finished her homework."`,[`She`,`has`,`finished`,`homework`],1,`"Has" helps the main verb "finished."`],
[`In "They will be singing tonight," what is the MAIN verb?`,[`will`,`be`,`singing`,`tonight`],2,`"Will" and "be" are helpers. "Singing" is the main action.`],
[`Which sentence uses "feel" as a LINKING verb?`,[`I feel tired today.`,`Feel the soft fur.`,`She felt the wall in the dark.`,`He feels the rain on his face.`],0,`"I am tired" still makes sense, so "feel" is linking.`],
[`Which word is a helping verb?`,[`quickly`,`could`,`under`,`happy`],1,`"Could" helps another verb: could win, could go.`],
[`Which sentence has a verb phrase (helping verb + main verb)?`,[`The bird sang.`,`The bird is singing.`,`The bird on the branch.`,`A singing bird.`],1,`"is singing" = helping verb + main verb.`],
[`Which is the strongest, most exact verb? "The horse ___ across the field."`,[`went`,`moved`,`galloped`,`got`],2,`"Galloped" paints a clear picture.`]
],
fix:[
[`She be happy today.`,[`She is happy today.`],`With "she," the form of "be" in present tense is "is."`],
[`I should of finished my homework.`,[`I should have finished my homework.`,`I should've finished my homework.`],`"Should of" is wrong. Use "should have."`],
[`We could of won the game.`,[`We could have won the game.`,`We could've won the game.`],`Use "could have," not "could of."`]
],
write:{p:`Write an exciting action scene of <b>6 to 8 sentences</b> (a sports game, a race, a rescue, a chase). Use at least <b>8 strong action verbs</b>. Do NOT use the weak verbs <i>went, got, did,</i> or <i>moved</i>. Then underline (or list at the end) your 8 best verbs.`,
list:[`I used at least 8 strong action verbs.`,`I avoided went, got, did, and moved.`,`I used at least one linking verb and one helping verb.`,`I did not write "should of / could of / would of."`,`I listed my strong verbs at the end.`],min:70}
},
/* ---------------- DAY 6 ---------------- */
{t:`Verb Tenses: Past, Present, Future`, s:`Telling WHEN something happens, and staying consistent`,
lesson:`
<h3>What is tense?</h3>
<p><mark>Tense</mark> tells <b>when</b> an action happens.</p>
<div class="tablewrap"><table>
<tr><th>Tense</th><th>When</th><th>Example</th></tr>
<tr><td><b>Present</b></td><td>now / every day</td><td>I <b>walk</b>. She <b>walks</b>.</td></tr>
<tr><td><b>Past</b></td><td>already happened</td><td>I <b>walked</b> yesterday.</td></tr>
<tr><td><b>Future</b></td><td>will happen</td><td>I <b>will walk</b> tomorrow.</td></tr>
</table></div>
<h3>Spelling rules for past tense (-ed)</h3>
<div class="tablewrap"><table>
<tr><th>Rule</th><th>Example</th></tr>
<tr><td>Most verbs: add -ed</td><td>play → played, jump → jumped</td></tr>
<tr><td>Ends in -e: add -d</td><td>bake → baked, smile → smiled</td></tr>
<tr><td>Consonant + y: change y to i, add -ed</td><td>carry → carried, try → tried</td></tr>
<tr><td>Short word, one vowel + one consonant: double it</td><td>stop → stopped, plan → planned</td></tr>
</table></div>
<div class="rule"><b>Present tense with he / she / it:</b> add -s or -es. <i>He plays. She watches. It flies.</i></div>
<h3>⭐ Stay in the same tense!</h3>
<p>The biggest tense mistake in writing is <b>switching</b> tenses in the middle of a story.</p>
<div class="ex"><div><span class="n">✘</span> Yesterday I <b>walk</b> to school and <b>saw</b> my friend.</div><div><span class="y">✔</span> Yesterday I <b>walked</b> to school and <b>saw</b> my friend.</div></div>
<div class="tip">💡 <b>Time words are clues:</b> <i>yesterday, last week, ago</i> → past. <i>every day, usually, now</i> → present. <i>tomorrow, next year, soon</i> → future.</div>`,
quiz:[
[`Which sentence is in the PAST tense?`,[`I walk to school.`,`I walked to school.`,`I will walk to school.`,`I am walking to school.`],1,`"Walked" happened already.`],
[`Which sentence is in the FUTURE tense?`,[`She cooks dinner.`,`She cooked dinner.`,`She will cook dinner.`,`She cooking dinner.`],2,`"Will cook" is future.`],
[`Past tense of "carry"?`,[`carryed`,`carried`,`carryd`,`carred`],1,`Consonant + y → change y to i, add -ed.`],
[`Past tense of "stop"?`,[`stoped`,`stopped`,`stopt`,`stops`],1,`Short word with one vowel + one consonant: double the p.`],
[`"Tomorrow, we ___ the museum."`,[`visited`,`visit`,`will visit`,`visiting`],2,`"Tomorrow" signals future tense.`],
[`Which sentence keeps the SAME tense?`,[`He opens the door and walked in.`,`He opened the door and walks in.`,`He opened the door and walked in.`,`He will open the door and walked in.`],2,`Both verbs are past tense.`],
[`"Every morning, my dad ___ coffee."`,[`drink`,`drinks`,`drinked`,`drinking`],1,`Present tense with "he" (my dad) needs -s.`],
[`Past tense of "try"?`,[`tryed`,`tried`,`trid`,`tryied`],1,`try → tried.`]
],
fix:[
[`Yesterday I walk to school and see my friend.`,[`Yesterday I walked to school and saw my friend.`,`Yesterday, I walked to school and saw my friend.`],`"Yesterday" means both verbs must be past tense.`],
[`Tomorrow we went to the zoo.`,[`Tomorrow we will go to the zoo.`,`Tomorrow, we will go to the zoo.`],`"Tomorrow" needs future tense.`],
[`She planed a party and invites everyone.`,[`She planned a party and invited everyone.`],`Double the n in "planned," and keep both verbs in past tense.`]
],
write:{p:`Write <b>7 to 9 sentences</b> about what you did last weekend. Write the whole story in the <b>past tense</b>. Then add <b>2 sentences</b> at the end about what you <b>will</b> do next weekend (future tense).`,
list:[`My story about last weekend is all in past tense.`,`I spelled -ed endings correctly (doubling letters, y → i).`,`My last 2 sentences use future tense (will ...).`,`I used time words like "first," "then," "after that."`,`I re-read to make sure I didn't switch tenses by accident.`],min:80}
},
/* ---------------- DAY 7 ---------------- */
{t:`Irregular Verbs & More Tenses`, s:`went/gone, saw/seen, and progressive & perfect tenses`,
lesson:`
<h3>Irregular verbs</h3>
<p>Most verbs add -ed in the past. <mark>Irregular verbs</mark> don't follow the rule — you have to memorize them. Each verb has 3 main forms:</p>
<div class="tablewrap"><table>
<tr><th>Present</th><th>Past (yesterday I...)</th><th>Past participle (I have...)</th></tr>
<tr><td>go</td><td>went</td><td>gone</td></tr><tr><td>see</td><td>saw</td><td>seen</td></tr><tr><td>eat</td><td>ate</td><td>eaten</td></tr><tr><td>do</td><td>did</td><td>done</td></tr><tr><td>write</td><td>wrote</td><td>written</td></tr><tr><td>take</td><td>took</td><td>taken</td></tr><tr><td>bring</td><td>brought</td><td>brought</td></tr><tr><td>begin</td><td>began</td><td>begun</td></tr><tr><td>swim</td><td>swam</td><td>swum</td></tr><tr><td>run</td><td>ran</td><td>run</td></tr><tr><td>give</td><td>gave</td><td>given</td></tr><tr><td>know</td><td>knew</td><td>known</td></tr><tr><td>break</td><td>broke</td><td>broken</td></tr><tr><td>choose</td><td>chose</td><td>chosen</td></tr><tr><td>drink</td><td>drank</td><td>drunk</td></tr>
</table></div>
<div class="rule"><b>Key rule:</b> The <b>past participle</b> (3rd column) needs a helper: <b>has, have, or had</b>.<br><span class="y">✔</span> I <b>went</b>. I <b>have gone</b>. <span class="n">✘</span> I have went. <span class="n">✘</span> I gone.<br><span class="y">✔</span> I <b>saw</b> it. I <b>have seen</b> it. <span class="n">✘</span> I seen it.</div>
<div class="warn">⚠️ "brung" and "bringed" are not words. Use <b>brought</b>.</div>
<h3>Progressive tense (action in progress)</h3>
<div class="rule">am / is / are / was / were + <b>-ing</b><br>I <b>am reading</b> (now). I <b>was reading</b> when the phone rang (past). I <b>will be reading</b> (future).</div>
<h3>Perfect tense</h3>
<div class="rule">has / have / had + <b>past participle</b><br>I <b>have finished</b> my homework (done before now).<br>By the time we arrived, the movie <b>had started</b> (done before another past event).</div>`,
quiz:[
[`Past tense of "go"?`,[`goed`,`gone`,`went`,`wented`],2,`go → went → (have) gone.`],
[`"I have ___ that movie three times."`,[`saw`,`seen`,`seed`,`see`],1,`After "have," use the past participle: seen.`],
[`"She ___ her lunch to school."`,[`brung`,`bringed`,`brought`,`brang`],2,`bring → brought.`],
[`"We have ___ all the cookies!"`,[`ate`,`eaten`,`eated`,`eat`],1,`After "have," use "eaten."`],
[`Which sentence shows an action IN PROGRESS?`,[`I read.`,`I have read.`,`I was reading.`,`I will read.`],2,`"Was reading" = progressive.`],
[`"By the time we arrived, the movie ___."`,[`has started`,`had started`,`starts`,`starting`],1,`One past action happened before another, so use "had started."`],
[`"He has ___ a letter to his grandma."`,[`wrote`,`writed`,`written`,`writ`],2,`After "has," use "written."`],
[`Which sentence is correct?`,[`I seen him yesterday.`,`I have saw him.`,`I saw him yesterday.`,`I have seed him.`],2,`Simple past: "saw." ("seen" needs have/has.)`]
],
fix:[
[`I have went there before.`,[`I have gone there before.`],`After "have," use "gone."`],
[`She brung her lunch.`,[`She brought her lunch.`],`bring → brought.`],
[`We seen that movie last week.`,[`We saw that movie last week.`],`Without "have," use the simple past: saw.`]
],
write:{p:`Write <b>8 sentences</b>: 4 sentences about things you <b>have done</b> and 4 about things you <b>have never done</b> but want to do. Use a different irregular verb in each sentence (for example: <i>I have swum in the ocean. I have never ridden a camel.</i>)`,
list:[`Each sentence uses "have" + the correct past participle.`,`I used at least 6 different irregular verbs.`,`I did not write "have went," "seen" without have, or "brung."`,`My sentences are complete and punctuated.`],min:60}
},
/* ---------------- DAY 8 ---------------- */
{t:`Subject–Verb Agreement`, s:`Making the subject and verb match`,
lesson:`
<h3>The main rule</h3>
<div class="rule">A <b>singular</b> subject takes a <b>singular</b> verb. A <b>plural</b> subject takes a <b>plural</b> verb.<br>The dog <mark>barks</mark>. The dogs <mark>bark</mark>.</div>
<div class="tip">💡 Strange but true: in the present tense, the <b>singular verb usually ends in -s</b> (he runs, she plays) while the <b>plural noun ends in -s</b> (dogs). Usually only ONE of them gets the s!</div>
<h3>Tricky situations</h3>
<div class="tablewrap"><table>
<tr><th>Situation</th><th>Example</th></tr>
<tr><td><b>Ignore the phrase in the middle.</b> Find the real subject.</td><td>The <b>box</b> of crayons <b>is</b> on the table. (not "are" — the box is)</td></tr>
<tr><td><b>Two subjects joined by "and"</b> = plural</td><td>Ben and Maya <b>walk</b> to school.</td></tr>
<tr><td><b>"or" / "nor"</b>: match the subject CLOSER to the verb</td><td>Either my mom or my <b>brothers are</b> coming. / Either my brothers or my <b>mom is</b> coming.</td></tr>
<tr><td><b>each, every, everyone, everybody, someone, nobody</b> = singular</td><td>Everyone <b>is</b> here. Each of the boys <b>has</b> a ticket.</td></tr>
<tr><td><b>There is / There are</b>: look at what comes AFTER</td><td>There <b>is</b> one cookie. There <b>are</b> three cookies.</td></tr>
<tr><td><b>doesn't</b> with he/she/it; <b>don't</b> with I/you/we/they</td><td>He <b>doesn't</b> like spinach. They <b>don't</b> like it.</td></tr>
<tr><td><b>Collective nouns</b> acting as one group = singular</td><td>The team <b>is</b> practicing.</td></tr>
</table></div>
<div class="warn">⚠️ "They was" and "we was" are always wrong. Use <b>were</b>: they were, we were, you were.</div>`,
quiz:[
[`"My sister ___ the piano."`,[`play`,`plays`,`playing`,`are playing`],1,`Singular subject (sister) → singular verb (plays).`],
[`"The box of crayons ___ on the table."`,[`is`,`are`],0,`The subject is "box" (one), not "crayons."`],
[`"Ben and Maya ___ to the park."`,[`walks`,`walk`],1,`Two subjects joined by "and" = plural.`],
[`"Either my mom or my brothers ___ picking me up."`,[`is`,`are`],1,`With "or," match the closer subject: brothers (plural).`],
[`"Everyone ___ excited about the trip."`,[`is`,`are`],0,`"Everyone" is singular.`],
[`"There ___ three cookies left."`,[`is`,`are`],1,`Three cookies = plural.`],
[`"He ___ like spinach."`,[`don't`,`doesn't`],1,`he/she/it → doesn't.`],
[`"They ___ late for the bus."`,[`was`,`were`],1,`"They" always takes "were."`]
],
fix:[
[`The box of crayons are on the table.`,[`The box of crayons is on the table.`],`The real subject is "box," which is singular.`],
[`He don't like spinach.`,[`He doesn't like spinach.`,`He does not like spinach.`],`he → doesn't.`],
[`There is three cookies left.`,[`There are three cookies left.`],`Three cookies is plural, so use "are."`]
],

/* ---------------- DAY 9 ---------------- */
{t:`Adjectives & Articles`, s:`Describing words, a/an/the, and comparing`,
lesson:`
<h3>What is an adjective?</h3>
<p>An <mark>adjective</mark> describes a <b>noun</b> or <b>pronoun</b>. It answers: <b>What kind? Which one? How many?</b></p>
<div class="ex"><div>What kind? → a <mark>fluffy</mark> cat, a <mark>cold</mark> day</div><div>Which one? → <mark>that</mark> book, the <mark>last</mark> slice</div><div>How many? → <mark>three</mark> kids, <mark>several</mark> ideas</div></div>
<p>Adjectives can come <b>before</b> a noun (<i>the tiny kitten</i>) or <b>after a linking verb</b> (<i>The kitten is tiny</i>).</p>
<h3>Articles: a, an, the</h3>
<div class="rule"><b>a</b> before a consonant <b>sound</b>: a dog, a <b>u</b>niversity (sounds like "you")<br><b>an</b> before a vowel <b>sound</b>: an apple, an <b>h</b>our (h is silent)<br><b>the</b> for something specific: <i>the</i> book on my desk</div>
<div class="tip">💡 Listen to the SOUND, not the letter!</div>
<h3>Comparing with adjectives</h3>
<div class="tablewrap"><table>
<tr><th></th><th>Comparative (2 things)</th><th>Superlative (3+ things)</th></tr>
<tr><td>Short words: -er / -est</td><td>tall → taller</td><td>tallest</td></tr>
<tr><td>Ending in y: change y to i</td><td>easy → easier</td><td>easiest</td></tr>
<tr><td>Long words (3+ syllables): more / most</td><td>more exciting</td><td>most exciting</td></tr>
<tr><td><b>Irregular</b></td><td>good → better · bad → worse · many → more</td><td>best · worst · most</td></tr>
</table></div>
<div class="warn">⚠️ Never use both! <span class="n">✘</span> more taller, most tallest, more smarter. <span class="y">✔</span> taller, tallest, smarter.</div>
<h3>Show, don't tell</h3>
<div class="ex"><div><span class="n">Plain:</span> It was a nice day.</div><div><span class="y">Vivid:</span> It was a warm, breezy, golden afternoon.</div></div>`,
quiz:[
[`Find the adjective: "The tiny kitten slept."`,[`The`,`tiny`,`kitten`,`slept`],1,`"Tiny" tells what kind of kitten.`],
[`Which article fits? "I waited for ___ hour."`,[`a`,`an`],1,`"Hour" starts with a vowel SOUND (the h is silent).`],
[`Which article fits? "She goes to ___ university in Boston."`,[`a`,`an`],0,`"University" starts with a "you" sound (consonant sound).`],
[`"This test is ___ than the last one."`,[`easyer`,`more easy`,`easier`,`easiest`],2,`Comparing two things: easy → easier.`],
[`"That was the ___ movie I have ever seen."`,[`more exciting`,`most exciting`,`excitingest`,`most excitingest`],1,`Long word, comparing many: most exciting.`],
[`Comparative of "good"?`,[`gooder`,`more good`,`better`,`best`],2,`good → better → best.`],
[`Superlative of "bad"?`,[`baddest`,`worse`,`worst`,`most bad`],2,`bad → worse → worst.`],
[`Which adjective tells HOW MANY?`,[`blue`,`several`,`soft`,`brave`],1,`"Several" tells how many.`]
],
fix:[
[`This is the most tallest building in town.`,[`This is the tallest building in town.`],`Don't use "most" with -est.`],
[`She is more smarter than her brother.`,[`She is smarter than her brother.`],`Don't use "more" with -er.`],
[`I ate a apple and a orange.`,[`I ate an apple and an orange.`],`Use "an" before vowel sounds.`]
],

list:[`I used at least 8 vivid adjectives.`,`I avoided nice, good, and bad.`,`I used one comparative and one superlative correctly.`,`I used a/an correctly.`,`I used my senses (sight, smell, taste, sound, touch).`],min:70}

/* ---------------- DAY 10 ---------------- */
{t:`Adverbs`, s:`How, when, where; good vs. well; no double negatives`,
lesson:`
<h3>What is an adverb?</h3>
<p>An <mark>adverb</mark> describes a <b>verb</b>, an <b>adjective</b>, or <b>another adverb</b>. It answers: <b>How? When? Where? How much?</b></p>
<div class="tablewrap"><table>
<tr><th>Question</th><th>Adverbs</th><th>Example</th></tr>
<tr><td>How?</td><td>slowly, quietly, carefully, well</td><td>The turtle moved <b>slowly</b>.</td></tr>
<tr><td>When?</td><td>yesterday, soon, now, later, always</td><td>We will leave <b>soon</b>.</td></tr>
<tr><td>Where?</td><td>here, there, outside, everywhere</td><td>The kids played <b>outside</b>.</td></tr>
<tr><td>How much?</td><td>very, too, extremely, almost</td><td>The test was <b>very</b> hard.</td></tr>
</table></div>
<div class="tip">💡 Many adverbs end in <b>-ly</b> (quick → quickly), but not all (fast, soon, very, well).</div>
<h3>Adjective or adverb?</h3>
<div class="rule">Describing a <b>noun</b> → adjective: She is a <b>quick</b> runner.<br>Describing a <b>verb</b> → adverb: She runs <b>quickly</b>.</div>
<h3>Good vs. well</h3>
<div class="rule"><b>good</b> = adjective (describes a noun, or comes after a linking verb): a good book; the pizza tastes good.<br><b>well</b> = adverb (describes how an action is done): She sings <b>well</b>. He did <b>well</b> on the test.</div>
<div class="ex"><div><span class="n">✘</span> She plays piano good. <span class="y">✔</span> She plays piano well.</div><div><span class="n">✘</span> He ran real quick. <span class="y">✔</span> He ran really quickly.</div></div>
<h3>No double negatives</h3>
<div class="warn">⚠️ Use only ONE negative word (no, not, never, nothing, nobody, none, n't) in a clause.<br><span class="n">✘</span> I don't have no homework. <span class="y">✔</span> I don't have any homework. <span class="y">✔</span> I have no homework.</div>`,
quiz:[
[`Find the adverb: "The turtle moved slowly."`,[`turtle`,`moved`,`slowly`,`The`],2,`"Slowly" tells HOW it moved.`],
[`"She plays the violin ___."`,[`good`,`well`],1,`It describes HOW she plays (a verb), so use the adverb "well."`],
[`"That pizza tastes ___."`,[`good`,`well`],0,`"Tastes" is a linking verb here, so use the adjective "good."`],
[`Which adverb tells WHEN?`,[`yesterday`,`loudly`,`here`,`very`],0,`"Yesterday" tells when.`],
[`Which sentence has a double negative (a mistake)?`,[`I don't have any money.`,`I have no money.`,`I don't have no money.`,`I have hardly any money.`],2,`"don't" + "no" = two negatives.`],
[`"The runner sprinted ___ to the finish line."`,[`quick`,`quickly`],1,`Describes how she sprinted → adverb.`],
[`In "The test was very hard," what does "very" describe?`,[`test`,`was`,`hard`,`The`],2,`"Very" describes the adjective "hard." Adverbs can describe adjectives.`],
[`Which sentence is correct?`,[`She did real good on the test.`,`She did really well on the test.`,`She did real well on the test.`,`She did really good on the test.`],1,`"really" (adverb) + "well" (adverb).`]
],
fix:[
[`She sings good.`,[`She sings well.`],`Describes how she sings → "well."`],
[`I don't have no homework tonight.`,[`I don't have any homework tonight.`,`I have no homework tonight.`,`I do not have any homework tonight.`],`Only one negative word.`],
[`He ran real quick.`,[`He ran really quickly.`,`He ran very quickly.`,`He ran really fast.`,`He ran very fast.`],`"Real" and "quick" are adjectives. Use adverbs: really/very + quickly.`]
],

list:[`I used at least 6 adverbs.`,`I included how, when, and where adverbs.`,`I used "well" (not "good") after an action verb.`,`I did not use any double negatives.`,`My sentences are complete and punctuated.`],min:70}
},
/* ---------------- DAY 11 ---------------- */
{t:`Prepositions`, s:`Words that show position, direction and time`,
lesson:`
<h3>What is a preposition?</h3>
<p>A <mark>preposition</mark> shows how a noun is <b>related</b> to another word — usually <b>where</b> or <b>when</b>.</p>
<div class="tip">💡 <b>The box trick:</b> Think of a cat and a box. The cat can be <i>in, on, under, behind, beside, near, inside, above, around, through, over, between</i> the box. Most of those words are prepositions!</div>
<div class="rule"><b>Common prepositions:</b> about, above, across, after, against, along, among, around, at, before, behind, below, beneath, beside, between, by, down, during, except, for, from, in, inside, into, near, of, off, on, onto, out, over, past, since, through, to, toward, under, until, up, upon, with, within, without</div>
<h3>Prepositional phrases</h3>
<p>A preposition + its <b>object</b> (a noun or pronoun) + any words in between = a <mark>prepositional phrase</mark>.</p>
<div class="ex"><div>The cat hid <mark>under the bed</mark>. (preposition: under · object: bed)</div><div><mark>After school</mark>, Leo plays soccer <mark>with his friends</mark>.</div></div>
<h3>Tricky pairs</h3>
<div class="tablewrap"><table>
<tr><th>Pair</th><th>Use</th></tr>
<tr><td><b>between</b> / <b>among</b></td><td>between = 2 people/things · among = 3 or more<br>Split it <i>between</i> you and me. Split it <i>among</i> the five kids.</td></tr>
<tr><td><b>in</b> / <b>into</b></td><td>in = location · into = movement from outside to inside<br>She is <i>in</i> the pool. She jumped <i>into</i> the pool.</td></tr>
<tr><td><b>off</b> (not "off of")</td><td><span class="n">✘</span> Get off of the couch. <span class="y">✔</span> Get off the couch.</td></tr>
</table></div>
<div class="warn">⚠️ Remember from Day 3: after a preposition, use an <b>object pronoun</b>: with <b>me</b>, for <b>them</b>, between you and <b>me</b>.</div>`,
quiz:[
[`Find the preposition: "The cat hid under the bed."`,[`cat`,`hid`,`under`,`bed`],2,`"Under" shows where the cat is in relation to the bed.`],
[`In "We walked to the store," what is the object of the preposition?`,[`We`,`walked`,`to`,`store`],3,`"to" is the preposition; "store" is its object.`],
[`Find the prepositional phrase: "After school, Leo plays soccer."`,[`After school`,`Leo plays`,`plays soccer`,`school, Leo`],0,`"After" + "school."`],
[`"Share the pizza ___ the two of you."`,[`between`,`among`],0,`Two people → between.`],
[`"Share the pizza ___ all ten players."`,[`between`,`among`],1,`Three or more → among.`],
[`"She jumped ___ the pool."`,[`in`,`into`],1,`Moving from outside to inside → into.`],
[`Which sentence is correct?`,[`Get off of the couch.`,`Get off the couch.`],1,`"Off of" is extra. Just use "off."`],
[`Which word is NOT a preposition?`,[`beside`,`during`,`through`,`quickly`],3,`"Quickly" is an adverb.`]
],
fix:[
[`The cat jumped off of the table.`,[`The cat jumped off the table.`],`Remove the extra "of."`],
[`Divide the candy between the five kids.`,[`Divide the candy among the five kids.`],`Five kids = more than two → among.`],
[`Dad came with Riya and I.`,[`Dad came with Riya and me.`],`After "with," use the object pronoun "me."`]
],

list:[`I used at least 8 prepositional phrases.`,`My directions are in a clear order.`,`I used "into" for movement and "in" for location.`,`I did not write "off of."`,`Someone could actually follow my directions.`],min:80}

/* ---------------- DAY 12 ---------------- */
{t:`Conjunctions & Interjections`, s:`Joining words (FANBOYS and more) and feeling words`,
lesson:`
<h3>What is a conjunction?</h3>
<p>A <mark>conjunction</mark> is a <b>joining word</b>. It connects words, phrases, or sentences.</p>
<h3>1. Coordinating conjunctions — FANBOYS</h3>
<div class="rule"><b>F</b>or · <b>A</b>nd · <b>N</b>or · <b>B</b>ut · <b>O</b>r · <b>Y</b>et · <b>S</b>o</div>
<div class="tablewrap"><table>
<tr><th>Word</th><th>Meaning</th><th>Example</th></tr>
<tr><td>and</td><td>adds</td><td>I like soccer, <b>and</b> I like chess.</td></tr>
<tr><td>but / yet</td><td>contrast (opposite)</td><td>I studied, <b>but</b> the test was hard.</td></tr>
<tr><td>so</td><td>result</td><td>I was hungry, <b>so</b> I made a sandwich.</td></tr>
<tr><td>or</td><td>choice</td><td>Do you want juice <b>or</b> milk?</td></tr>
<tr><td>for</td><td>because (formal)</td><td>He smiled, <b>for</b> he had won.</td></tr>
<tr><td>nor</td><td>not this either</td><td>He didn't call, <b>nor</b> did he write.</td></tr>
</table></div>
<div class="tip">💡 When FANBOYS joins two complete sentences, put a <b>comma before</b> it: <i>It rained, so we stayed in.</i></div>
<h3>2. Subordinating conjunctions</h3>
<div class="rule">because · although · when · while · if · since · after · before · unless · until · as · even though</div>
<p>They make one part <b>depend</b> on the other: <i><b>Although</b> it was late, we kept reading.</i> · <i>We stayed in <b>because</b> it rained.</i></p>
<div class="warn">⚠️ A clause starting with a subordinating conjunction can't stand alone. "Because it rained." is NOT a sentence (more on Day 14).</div>
<h3>3. Correlative conjunctions (pairs)</h3>
<div class="rule">either...<b>or</b> · neither...<b>nor</b> · both...<b>and</b> · not only...<b>but also</b><br>Neither Sam <b>nor</b> Maya came. (never "neither...or")</div>
<h3>Interjections</h3>
<p>An <mark>interjection</mark> shows strong feeling: <i>Wow! Ouch! Oh no! Hooray! Yikes!</i> Use an exclamation mark for strong feelings, or a comma for mild ones: <i>Oh, I forgot.</i></p>`,
quiz:[
[`What does FANBOYS stand for?`,[`For, And, Nor, But, Or, Yet, So`,`Find, Ask, Now, Begin, Open, Yell, Stop`,`For, After, Now, Because, Or, Yet, Since`,`Few, All, No, Both, One, Your, Some`],0,`These are the 7 coordinating conjunctions.`],
[`"I wanted to play outside, ___ it was raining."`,[`and`,`but`,`so`,`or`],1,`The ideas contrast, so use "but."`],
[`"I was hungry, ___ I made a sandwich."`,[`but`,`or`,`so`,`nor`],2,`Making a sandwich is the result → "so."`],
[`Which is a subordinating conjunction?`,[`and`,`because`,`but`,`or`],1,`"Because" makes a dependent clause.`],
[`"Neither Sam ___ Maya came to the party."`,[`or`,`nor`,`and`,`but`],1,`neither goes with nor.`],
[`"___ it was late, we kept reading."`,[`Although`,`And`,`So`,`Or`],0,`"Although" shows contrast at the start of a sentence.`],
[`Which is an interjection?`,[`Wow!`,`happy`,`under`,`because`],0,`"Wow!" shows strong feeling.`],
[`"Would you like juice ___ milk?"`,[`or`,`nor`,`so`,`yet`],0,`Choice → "or."`]
],
fix:[
[`I wanted to go outside, it was raining.`,[`I wanted to go outside, but it was raining.`,`I wanted to go outside, yet it was raining.`],`Add a FANBOYS word that shows contrast.`],
[`Neither Sam or Maya came.`,[`Neither Sam nor Maya came.`],`neither → nor.`],
[`I was tired so I went to bed early.`,[`I was tired, so I went to bed early.`],`Put a comma before FANBOYS when it joins two sentences.`]
],
write:{p:`Write <b>8 sentences</b> about your favorite season. Use at least <b>3 different FANBOYS</b> (with commas when joining two sentences), at least <b>3 different subordinating conjunctions</b> (because, although, when, if...), and <b>1 interjection</b>.`,
list:[`I used 3 different FANBOYS conjunctions.`,`I put a comma before FANBOYS when joining two complete sentences.`,`I used 3 different subordinating conjunctions.`,`I used 1 interjection with correct punctuation.`,`None of my sentences is just a "Because..." fragment.`],min:80}
},
/* ---------------- DAY 13 ---------------- */
{t:`The Sentence`, s:`Subject + predicate, and the four kinds of sentences`,
lesson:`
<h3>What makes a sentence complete?</h3>
<div class="rule">A complete sentence needs <b>3 things</b>:<br>1. A <b>subject</b> — who or what the sentence is about<br>2. A <b>predicate</b> (with a verb) — what the subject does or is<br>3. A <b>complete thought</b> — it makes sense on its own</div>
<div class="ex"><div><mark>The tall girl in the red coat</mark> | <b>won the race</b>.</div><div>Complete subject ↑ &nbsp;&nbsp;&nbsp;&nbsp; ↑ Complete predicate</div></div>
<p>The <b>simple subject</b> is the main noun (<i>girl</i>). The <b>simple predicate</b> is the main verb (<i>won</i>).</p>
<div class="tip">💡 <b>How to find them:</b> Find the verb first. Then ask "Who or what [verb]?" → that's the subject. "Who won?" → the girl.</div>
<h3>The four kinds of sentences</h3>
<div class="tablewrap"><table>
<tr><th>Type</th><th>Job</th><th>Ends with</th><th>Example</th></tr>
<tr><td><b>Declarative</b></td><td>makes a statement</td><td>.</td><td>The bell rang.</td></tr>
<tr><td><b>Interrogative</b></td><td>asks a question</td><td>?</td><td>Do you like tacos?</td></tr>
<tr><td><b>Imperative</b></td><td>gives a command or request</td><td>. or !</td><td>Please close the door.</td></tr>
<tr><td><b>Exclamatory</b></td><td>shows strong feeling</td><td>!</td><td>What a beautiful sunset!</td></tr>
</table></div>
<div class="rule">In an imperative sentence, the subject is <b>"you" (understood)</b>. "Close the door." = "(You) close the door."</div>
<div class="warn">⚠️ Every sentence starts with a <b>capital letter</b> and ends with <b>. ? or !</b> — no exceptions.</div>`,
quiz:[
[`What does every complete sentence need?`,[`A subject, a verb, and a complete thought`,`An adjective and a noun`,`At least ten words`,`A comma`],0,`Subject + verb + complete thought.`],
[`Find the complete subject: "The tall girl in the red coat won the race."`,[`The tall girl in the red coat`,`won the race`,`the race`,`red coat`],0,`All the words about who did it.`],
[`Find the simple predicate (main verb): "My little brother ate all the cookies."`,[`brother`,`ate`,`cookies`,`little`],1,`"Ate" is the main verb.`],
[`"Please close the window." This sentence is...`,[`declarative`,`interrogative`,`imperative`,`exclamatory`],2,`It gives a request/command.`],
[`"Do you like tacos?" is...`,[`declarative`,`interrogative`,`imperative`,`exclamatory`],1,`It asks a question.`],
[`"What a beautiful sunset!" is...`,[`declarative`,`interrogative`,`imperative`,`exclamatory`],3,`It shows strong feeling.`],
[`In "Close the door," what is the subject?`,[`door`,`Close`,`"You" — it is understood`,`There is no subject`],2,`Commands have an understood "you."`],
[`Which is a complete sentence?`,[`Running down the hall.`,`The boy in the blue shirt.`,`The bell rang.`,`Because I said so.`],2,`It has a subject (bell), verb (rang), and complete thought.`]
],
fix:[
[`what time is it.`,[`What time is it?`],`Capital letter, and a question needs a question mark.`],
[`please close the door`,[`Please close the door.`,`Please close the door!`],`Capital letter and end punctuation.`],
[`wow, that was amazing`,[`Wow, that was amazing!`],`Strong feeling → exclamation mark.`]
],

list:[`I wrote 2 of each kind of sentence.`,`I labeled every sentence.`,`Each sentence has the right end mark.`,`Every sentence starts with a capital letter.`,`Every sentence is a complete thought.`],min:60}

/* ---------------- DAY 14 ---------------- */
{t:`Fragments & Run-ons`, s:`The two biggest sentence mistakes — and how to fix them`,
lesson:`
<h3>Fragments (not enough)</h3>
<p>A <mark>fragment</mark> is a piece of a sentence pretending to be a whole one. It is missing a subject, a verb, or a complete thought.</p>
<div class="ex"><div><span class="n">✘</span> Running down the street. <i>(Who?)</i></div><div><span class="n">✘</span> The dog that lives next door. <i>(What about it?)</i></div><div><span class="n">✘</span> Because it was raining. <i>(Then what?)</i></div></div>
<div class="rule"><b>Fix a fragment:</b> add what's missing, OR attach it to the sentence next to it.<br><span class="y">✔</span> I saw a boy running down the street.<br><span class="y">✔</span> The dog that lives next door barks all night.<br><span class="y">✔</span> We stayed inside because it was raining.</div>
<h3>Run-ons and comma splices (too much)</h3>
<p>A <mark>run-on</mark> crashes two complete sentences together with nothing between them. A <mark>comma splice</mark> joins them with only a comma.</p>
<div class="ex"><div><span class="n">✘ Run-on:</span> I love pizza it is my favorite food.</div><div><span class="n">✘ Comma splice:</span> I love pizza, it is my favorite food.</div></div>
<div class="rule"><b>4 ways to fix a run-on:</b><br>1. <b>Period:</b> I love pizza. It is my favorite food.<br>2. <b>Comma + FANBOYS:</b> I love pizza, and it is my favorite food.<br>3. <b>Semicolon:</b> I love pizza; it is my favorite food.<br>4. <b>Subordinating conjunction:</b> I love pizza because it is my favorite food.</div>
<div class="tip">💡 <b>Read it aloud.</b> Where you naturally stop and take a breath, you probably need a period. Where you hear "Then what?", you have a fragment.</div>`,
quiz:[

[`Which correctly fixes "It was late we went home"?`,[`It was late, we went home.`,`It was late, so we went home.`,`It was late we, went home.`,`It was late so we went home,`],1,`Comma + FANBOYS.`],
[`Which is a fragment?`,[`After the game ended.`,`The game ended.`,`We cheered after the game ended.`,`The game ended, and we cheered.`],0,`"After the game ended" — then what?`],
[`Which fixes the fragment "Wearing a big hat."?`,[`Wearing a big hat!`,`The man was wearing a big hat.`,`Wearing, a big hat.`,`Wearing a big hat and.`],1,`It now has a subject and full verb.`],
[`Which is correct?`,[`I studied hard, I passed the test.`,`I studied hard I passed the test.`,`I studied hard, and I passed the test.`,`I studied hard and, I passed the test.`],2,`Comma + "and."`],
[`Is this complete? "The dog that lives next door."`,[`Yes, it is complete`,`No, it is a fragment — what about the dog?`,`No, it is a run-on`,`Yes, but it needs a question mark`],1,`There is no main verb telling what the dog does.`]
],

{t:`Simple, Compound & Complex Sentences`, s:`Building sentence variety like a real writer`,
lesson:`
<h3>First, two kinds of clauses</h3>
<div class="rule">A <b>clause</b> is a group of words with a subject and a verb.<br><b>Independent clause</b> = can stand alone as a sentence: <i>we ran outside</i><br><b>Dependent clause</b> = can NOT stand alone (starts with because, when, if, although...): <i>when the bell rang</i></div>
<h3>The three sentence types</h3>
<div class="tablewrap"><table>
<tr><th>Type</th><th>Recipe</th><th>Example</th></tr>
<tr><td><b>Simple</b></td><td>1 independent clause</td><td>The cat slept.<br>Sam and Tia laughed and clapped. <i>(still simple — one clause)</i></td></tr>
<tr><td><b>Compound</b></td><td>independent + <b>, FANBOYS</b> + independent<br>(or independent <b>;</b> independent)</td><td>I studied, <b>and</b> I passed.<br>It was late; we went home.</td></tr>
<tr><td><b>Complex</b></td><td>independent + dependent clause</td><td><b>When the bell rang</b>, we ran outside.<br>We ran outside <b>when the bell rang</b>.</td></tr>
</table></div>
<div class="rule"><b>Comma rule for complex sentences:</b> If the dependent clause comes FIRST, put a comma after it. If it comes second, you usually don't need one.<br><i>If you finish early, you may read.</i> · <i>You may read if you finish early.</i></div>
<h3>Why does this matter?</h3>
<p>Good writers <b>mix</b> sentence types so their writing doesn't sound choppy.</p>
<div class="ex"><div><span class="n">Choppy:</span> I was tired. I had homework. I finished it. I went to bed.</div><div><span class="y">Smooth:</span> Although I was tired, I finished my homework, and then I went to bed.</div></div>`,
quiz:[
[`"The cat slept." is a...`,[`simple sentence`,`compound sentence`,`complex sentence`,`fragment`],0,`One independent clause.`],
[`"I studied, and I passed." is a...`,[`simple`,`compound`,`complex`,`fragment`],1,`Two independent clauses joined with ", and."`],
[`"When the bell rang, we ran outside." is a...`,[`simple`,`compound`,`complex`,`run-on`],2,`Dependent clause + independent clause.`],
[`A compound sentence joins two independent clauses with...`,[`a comma + FANBOYS, or a semicolon`,`only a comma`,`nothing`,`an adjective`],0,`A comma alone would be a comma splice.`],
[`Which is the dependent clause? "We stayed inside because it was raining."`,[`We stayed inside`,`because it was raining`,`stayed inside`,`We stayed`],1,`It starts with "because" and can't stand alone.`],
[`"Sam and Tia laughed and clapped." is...`,[`simple`,`compound`,`complex`,`run-on`],0,`Two subjects and two verbs, but only ONE clause.`],
[`Where does the comma go? "If you finish early you may read."`,[`If, you finish early you may read.`,`If you finish early, you may read.`,`If you finish, early you may read.`,`No comma needed`],1,`Put the comma after the dependent clause when it comes first.`],
[`Which best combines "I was tired. I finished my homework."?`,[`I was tired, I finished my homework.`,`Although I was tired, I finished my homework.`,`I was tired I finished my homework.`,`Although I was tired. I finished my homework.`],1,`A correct complex sentence.`]
],

[`Combine: The sun set. The sky turned orange.`,[`When the sun set, the sky turned orange.`,`As the sun set, the sky turned orange.`,`The sun set, and the sky turned orange.`,`The sky turned orange when the sun set.`,`The sky turned orange as the sun set.`],`Make one compound or complex sentence. (Don't type "Combine:".)`],
[`Combine: It was raining. We played inside.`,[`It was raining, so we played inside.`,`Because it was raining, we played inside.`,`We played inside because it was raining.`,`Since it was raining, we played inside.`,`We played inside since it was raining.`],`Use "so" or "because."`],
[`Fix the comma: Before we left we locked the door.`,[`Before we left, we locked the door.`],`Dependent clause first → comma after it. (Don't type "Fix the comma:".)`]
],

{t:`Capitalization`, s:`All the rules for capital letters`,
lesson:`
<h3>Always capitalize...</h3>
<div class="tablewrap"><table>
<tr><th>Rule</th><th>Examples</th></tr>
<tr><td>The first word of every sentence</td><td><b>T</b>he dog barked.</td></tr>
<tr><td>The word <b>I</b></td><td>Mom and <b>I</b> went shopping.</td></tr>
<tr><td>Names of people and pets</td><td><b>A</b>nanya, <b>M</b>ax, <b>D</b>r. <b>P</b>atel</td></tr>
<tr><td>Specific places</td><td><b>B</b>oston, <b>M</b>assachusetts, <b>I</b>ndia, <b>L</b>ake <b>M</b>ichigan</td></tr>
<tr><td>Days, months, holidays</td><td><b>M</b>onday, <b>J</b>uly, <b>D</b>iwali, <b>T</b>hanksgiving</td></tr>
<tr><td>Languages, nationalities</td><td><b>E</b>nglish, <b>S</b>panish, <b>H</b>indi, <b>A</b>merican</td></tr>
<tr><td>Titles before names</td><td><b>D</b>r. Lee, <b>M</b>rs. Gomez, <b>U</b>ncle <b>R</b>aj, <b>P</b>resident Lincoln</td></tr>
<tr><td>Main words in titles of books, movies, songs</td><td><i><b>C</b>harlotte's <b>W</b>eb</i>, <i>The <b>L</b>ion, the <b>W</b>itch and the <b>W</b>ardrobe</i></td></tr>
<tr><td>Names of companies, schools, teams</td><td><b>G</b>oogle, <b>L</b>incoln <b>M</b>iddle <b>S</b>chool, <b>R</b>ed <b>S</b>ox</td></tr>
</table></div>
<div class="rule"><b>In titles,</b> capitalize the first and last word and all important words. Keep small words (a, an, the, and, but, or, of, in, on, at, to) lowercase unless they are first.</div>
<h3>Do NOT capitalize...</h3>
<div class="tablewrap"><table>
<tr><th>Rule</th><th>✘ Wrong</th><th>✔ Right</th></tr>
<tr><td>Seasons</td><td>I love Summer.</td><td>I love summer.</td></tr>
<tr><td>School subjects (except languages)</td><td>I like Math and Science.</td><td>I like math, science, and English.</td></tr>
<tr><td>Family words after my/your/his</td><td>My Mom is a nurse.</td><td>My mom is a nurse. (But: "Thanks, Mom!")</td></tr>
<tr><td>Directions (when it means which way)</td><td>Drive North.</td><td>Drive north. (But: "We live in the South.")</td></tr>
<tr><td>Titles NOT before a name</td><td>The Doctor was kind.</td><td>The doctor was kind.</td></tr>
<tr><td>Random important words</td><td>We had a Big Test.</td><td>We had a big test.</td></tr>
</table></div>
<div class="tip">💡 <b>Mom/Dad trick:</b> If you can replace it with a name (Thanks, <i>Priya</i>!), capitalize it. If "my" or "your" is in front, don't.</div>`,
quiz:[
[`Which is capitalized correctly?`,[`we visited aunt priya in july.`,`We visited Aunt Priya in July.`,`We Visited Aunt Priya In July.`,`We visited aunt Priya in july.`],1,`First word, title + name, and month.`],
[`Which is correct?`,[`I love Summer.`,`I love summer.`],1,`Seasons are not capitalized.`],
[`Which is correct?`,[`My Mom made dinner.`,`my mom made dinner.`,`My mom made dinner.`,`My MOM made dinner.`],2,`After "my," don't capitalize mom.`],

[`Which book title is correct?`,[`The Lion, The Witch And The Wardrobe`,`The Lion, the Witch and the Wardrobe`,`the lion, the witch and the wardrobe`,`The lion, the witch and the wardrobe`],1,`Capitalize main words; keep "the" and "and" small (except at the start).`],
[`Which is correct?`,[`We drove North for an hour.`,`We drove north for an hour.`],1,`A direction of travel is lowercase.`],
[`Which school subject needs a capital?`,[`science`,`math`,`english`,`history`],2,`English is a language, so it is always capitalized.`],
[`Which is correct?`,[`I saw Dr. Patel today.`,`I saw dr. Patel today.`,`I saw Dr. patel today.`,`i saw Dr. Patel today.`],0,`Title before a name + name are capitalized.`]
],

{t:`Commas`, s:`The seven comma rules every writer needs`,
lesson:`
<p>A <mark>comma ( , )</mark> tells the reader to take a short pause. Commas have specific jobs — don't just sprinkle them in!</p>
<div class="rule"><b>Rule 1 — Items in a list</b><br>I bought eggs<b>,</b> milk<b>,</b> and bread.<br><small>(The comma before "and" is called the Oxford comma. Many teachers want it — it makes lists clearer.)</small></div>
<div class="rule"><b>Rule 2 — After introductory words</b><br>Yes<b>,</b> I can come. · Well<b>,</b> that was strange. · However<b>,</b> it rained. · First<b>,</b> preheat the oven.</div>
<div class="rule"><b>Rule 3 — After a dependent clause or long phrase at the start</b><br>When the bell rang<b>,</b> the students lined up. · After a long day at school<b>,</b> I took a nap.</div>
<div class="rule"><b>Rule 4 — Before FANBOYS joining two sentences</b><br>I ran fast<b>,</b> but I still lost.</div>
<div class="rule"><b>Rule 5 — Direct address (talking TO someone by name)</b><br>Mom<b>,</b> can I go outside? · Thanks<b>,</b> Leo. · Listen<b>,</b> class<b>,</b> to the instructions.</div>
<div class="rule"><b>Rule 6 — Extra information (interrupters / appositives)</b><br>Max<b>,</b> my dog<b>,</b> loves bones. · My teacher<b>,</b> Mr. Kim<b>,</b> is funny.<br><small>Test: if you remove the words between the commas, the sentence still works.</small></div>
<div class="rule"><b>Rule 7 — Dates and addresses</b><br>July 4<b>,</b> 1776 · Monday<b>,</b> June 5 · Boston<b>,</b> Massachusetts</div>
<div class="warn">⚠️ <b>Don't put a comma</b> between a subject and its verb: <span class="n">✘</span> My best friend, lives next door. And remember: a comma alone can't join two sentences (comma splice — Day 14).</div>
<div class="tip">💡 "Let's eat<b>,</b> Grandma!" vs "Let's eat Grandma!" — commas save lives. 😄</div>`,
quiz:[
[`Which list uses commas correctly?`,[`I like red, blue, and green.`,`I like red blue, and green.`,`I like, red, blue, and green.`,`I like red, blue, and, green.`],0,`Commas separate each item.`],
[`Where does the comma go? "Mom can I have a snack?"`,[`Mom, can I have a snack?`,`Mom can I, have a snack?`,`Mom can, I have a snack?`,`No comma needed`],0,`Direct address: you are talking TO Mom.`],
[`Which is correct?`,[`Yes I would love to come.`,`Yes, I would love to come.`],1,`Comma after an introductory word.`],
[`Which compound sentence is punctuated correctly?`,[`I ran fast but I lost.`,`I ran fast, but I lost.`,`I ran fast but, I lost.`,`I ran, fast but I lost.`],1,`Comma before FANBOYS.`],
[`Which date is correct?`,[`July 4 1776`,`July, 4 1776`,`July 4, 1776`,`July 4 1776,`],2,`Comma between the day and the year.`],
[`Which is correct?`,[`She lives in Austin Texas.`,`She lives in Austin, Texas.`,`She lives in, Austin Texas.`],1,`Comma between city and state.`],
[`Which uses commas around extra information correctly?`,[`My dog, Max loves bones.`,`My dog Max, loves bones.`,`Max, my dog, loves bones.`,`Max my dog, loves bones.`],2,`"my dog" is extra information, so commas go on both sides.`],
[`Which is correct?`,[`When we got home, we ate dinner.`,`When we got home we, ate dinner.`,`When, we got home we ate dinner.`],0,`Comma after the introductory dependent clause.`]
],
fix:[
[`I bought eggs milk and bread.`,[`I bought eggs, milk, and bread.`,`I bought eggs, milk and bread.`],`Separate list items with commas.`],
[`Mom can I go outside?`,[`Mom, can I go outside?`],`Direct address needs a comma.`],
[`When the bell rang the students lined up.`,[`When the bell rang, the students lined up.`],`Comma after the dependent clause at the start.`]
],

{t:`Apostrophes, Quotes, Colons & Semicolons`, s:`The rest of the punctuation toolbox`,
lesson:`
<h3>Apostrophes ( ' )</h3>
<div class="rule"><b>Job 1 — Contractions</b> (the apostrophe replaces missing letters):<br>do not → don't · can not → can't · will not → won't · I am → I'm · it is → it's · they are → they're · you are → you're · we are → we're · I have → I've · she would → she'd<br><b>Job 2 — Possession</b> (Day 2): Sam's bike, the dogs' bowls</div>
<h3>Quotation marks ( " " ) for dialogue</h3>
<div class="rule">Put the <b>exact words</b> someone says inside quotation marks.<br>1. Commas and periods go <b>inside</b> the closing quotation mark.<br>2. Use a comma to separate the speaker tag from the quote.<br>3. Capitalize the first word of the quote.<br>4. Start a <b>new paragraph</b> every time a new person speaks.</div>
<div class="ex"><div><span class="y">✔</span> "I can't come," said Ben.</div><div><span class="y">✔</span> Ben said, "I can't come."</div><div><span class="y">✔</span> "Are you ready?" she asked.</div><div><span class="y">✔</span> She asked, "Are you ready?"</div><div><span class="n">✘</span> "I can't come" said Ben. &nbsp; <span class="n">✘</span> "I can't come", said Ben.</div></div>
<p>Quotation marks also go around titles of <b>short works</b>: songs, poems, short stories, articles. (Books and movies are written in <i>italics</i> or underlined.)</p>
<h3>Colon ( : )</h3>
<div class="rule">Use a colon <b>after a complete sentence</b> to introduce a list or explanation.<br><span class="y">✔</span> You need three things: a pencil, an eraser, and paper.<br><span class="n">✘</span> You need: a pencil, an eraser, and paper. <i>("You need" is not complete.)</i><br>Also used in times: 3:45 p.m.</div>
<h3>Semicolon ( ; )</h3>
<div class="rule">A semicolon joins two <b>closely related complete sentences</b> without a conjunction.<br><span class="y">✔</span> I love pizza; it is my favorite food.<br>Test: each side of the semicolon must be able to stand alone as a sentence.</div>`,
quiz:[
[`Which contraction is correct for "do not"?`,[`do'nt`,`dont'`,`don't`,`dont`],2,`The apostrophe replaces the missing "o."`],
[`Which dialogue is punctuated correctly?`,[`"I'm hungry" said Ben.`,`"I'm hungry," said Ben.`,`"I'm hungry", said Ben.`,`"I'm hungry. said Ben."`],1,`Comma goes inside the closing quotation mark.`],
[`Which is correct?`,[`She asked, "Are you ready?"`,`She asked, "Are you ready"?`,`She asked "are you ready?"`,`She asked, Are you ready?`],0,`Comma after "asked," capital A, question mark inside.`],
[`Where should the colon go?`,[`I need: a pencil, paper, and glue.`,`I need three things: a pencil, paper, and glue.`,`I: need three things a pencil, paper, and glue.`],1,`A colon comes after a complete sentence.`],
[`Which uses a semicolon correctly?`,[`I love pizza; it is delicious.`,`I love; pizza it is delicious.`,`I love pizza; and delicious.`,`I; love pizza.`],0,`Two complete sentences on each side.`],
[`"we are" as a contraction is...`,[`were`,`we're`,`wer'e`,`w'ere`],1,`we + are = we're. ("were" is a different word.)`],
[`Which is correct for a POEM title?`,[`I read the poem "The Road Not Taken."`,`I read the poem The Road Not Taken.`],0,`Short works like poems go in quotation marks.`],
[`When writing dialogue, what do you do when a NEW person starts speaking?`,[`Start a new paragraph`,`Use a semicolon`,`Keep it on the same line`,`Use all capital letters`],0,`New speaker = new paragraph.`]
],
